<div class="flex flex-wrap items-start justify-between gap-3">
  <div>
    <h1 class="text-xl font-bold text-granite-950 dark:text-granite-50">CMS — Home</h1>
    <p class="mt-1 text-sm text-granite-600 dark:text-granite-400">
      El contenido de la página de inicio de tu sitio. Guardas un borrador; publicar lo hace
      visible.
    </p>
  </div>
  <div class="flex flex-wrap items-center gap-3">
    <app-publish-bar [unpublished]="unpublished()" [busy]="busy()" (publish)="publish()" />
    <button
      type="button"
      class="btn-primary"
      (click)="save()"
      [disabled]="form.invalid || busy() || !form.dirty"
    >
      Guardar borrador
    </button>
  </div>
</div>

<form [formGroup]="form" class="mt-5 flex flex-col gap-4" (ngSubmit)="save()">
  <!-- Hero + Services as tabs; both panels stay mounted so the reactive form
       keeps every control registered (validation spans inactive tabs). -->
  <p-tabs value="portada">
    <p-tablist>
      <p-tab value="portada">Portada</p-tab>
      <p-tab value="servicios">Servicios</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="portada">
        <div class="flex max-w-3xl flex-col gap-4">
          <div class="field-group">
            <label class="field-label" for="cms-title"
              >Título<span aria-hidden="true"> *</span></label
            >
            <input id="cms-title" pInputText formControlName="title" />
            <p class="text-sm text-granite-500 dark:text-granite-400">
              El rotador de audiencias lo completa (p. ej. «… para plantas»).
            </p>
          </div>

          <div class="field-group">
            <label class="field-label" for="cms-description"
              >Descripción<span aria-hidden="true"> *</span></label
            >
            <textarea
              id="cms-description"
              pTextarea
              formControlName="description"
              rows="3"
            ></textarea>
          </div>

          <div class="field-group">
            <span class="field-label">Audiencias del rotador</span>
            <app-repeater
              [array]="serviceTargets"
              addLabel="Agregar audiencia"
              itemName="audiencia"
              (add)="addTarget()"
            >
              <ng-template #row let-ctrl let-i="index">
                <input
                  pInputText
                  [formControl]="ctrl | asControl"
                  [attr.aria-label]="'Audiencia ' + (i + 1)"
                />
              </ng-template>
            </app-repeater>
          </div>

          <div class="field-group">
            <span class="field-label">Métricas de portada</span>
            <app-repeater
              [array]="badges"
              addLabel="Agregar métrica"
              itemName="métrica"
              [divided]="true"
              (add)="addBadge()"
            >
              <ng-template #row let-ctrl let-i="index">
                <div class="grid gap-2 sm:grid-cols-3" [formGroup]="ctrl | asGroup">
                  <div class="field-group">
                    <label class="field-label" [for]="'cms-badge-value-' + i">Valor</label>
                    <input
                      [id]="'cms-badge-value-' + i"
                      pInputText
                      formControlName="value"
                      placeholder="+120"
                    />
                  </div>
                  <div class="field-group">
                    <label class="field-label" [for]="'cms-badge-unit-' + i">Unidad</label>
                    <input
                      [id]="'cms-badge-unit-' + i"
                      pInputText
                      formControlName="unit"
                      placeholder="toneladas"
                    />
                  </div>
                  <div class="field-group">
                    <label class="field-label" [for]="'cms-badge-label-' + i">Etiqueta</label>
                    <input
                      [id]="'cms-badge-label-' + i"
                      pInputText
                      formControlName="label"
                      placeholder="instaladas"
                    />
                  </div>
                </div>
              </ng-template>
            </app-repeater>
          </div>
        </div>
      </p-tabpanel>

      <p-tabpanel value="servicios">
        <div class="flex max-w-3xl flex-col gap-4">
          <div class="grid gap-4" formGroupName="services_content">
            <div class="field-group">
              <label class="field-label" for="cms-sc-eyebrow">Antetítulo</label>
              <input id="cms-sc-eyebrow" pInputText formControlName="eyebrow" />
            </div>
            <div class="field-group">
              <label class="field-label" for="cms-sc-title"
                >Título de la sección<span aria-hidden="true"> *</span></label
              >
              <input id="cms-sc-title" pInputText formControlName="title" />
            </div>
            <div class="field-group">
              <label class="field-label" for="cms-sc-description"
                >Descripción<span aria-hidden="true"> *</span></label
              >
              <textarea
                id="cms-sc-description"
                pTextarea
                formControlName="description"
                rows="2"
              ></textarea>
            </div>
          </div>

          <div class="field-group">
            <span class="field-label">Tarjetas de servicio</span>
            <app-repeater
              [array]="services"
              addLabel="Agregar servicio"
              itemName="servicio"
              [divided]="true"
              (add)="addService()"
            >
              <ng-template #row let-ctrl let-i="index">
                <div class="grid gap-2" [formGroup]="ctrl | asGroup">
                  <input
                    pInputText
                    formControlName="title"
                    [attr.aria-label]="'Título del servicio ' + (i + 1)"
                    placeholder="Mantenimiento"
                  />
                  <textarea
                    pTextarea
                    formControlName="description"
                    rows="2"
                    class="!min-h-16"
                    [attr.aria-label]="'Descripción del servicio ' + (i + 1)"
                  ></textarea>
                  <input
                    pInputText
                    formControlName="tagsCsv"
                    [attr.aria-label]="'Etiquetas del servicio ' + (i + 1) + ' (separadas por coma)'"
                    placeholder="Preventivo, Correctivo 24/7"
                  />
                </div>
              </ng-template>
            </app-repeater>
          </div>
        </div>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>

  <!-- Footer + CTA -->
  <section class="card-section flex flex-col gap-4" aria-labelledby="cms-footer-title">
    <h2 id="cms-footer-title" class="section-heading">Cierre y contacto</h2>
    <div class="grid gap-4 lg:grid-cols-3">
      <div class="field-group">
        <label class="field-label" for="cms-service-area">Zona de servicio</label>
        <input id="cms-service-area" pInputText formControlName="service_area" />
      </div>
      <div class="grid gap-4 lg:col-span-2 lg:grid-cols-2" formGroupName="contact_cta">
        <div class="field-group">
          <label class="field-label" for="cms-cta-title">Título del llamado</label>
          <input id="cms-cta-title" pInputText formControlName="title" />
        </div>
        <div class="field-group">
          <label class="field-label" for="cms-cta-description">Texto del llamado</label>
          <input id="cms-cta-description" pInputText formControlName="description" />
        </div>
      </div>
    </div>
  </section>
</form>
