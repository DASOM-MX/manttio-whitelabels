<p-dialog
  [visible]="dialogOpen()"
  (visibleChange)="!$event && close()"
  [modal]="true"
  [closable]="!submitting()"
  [draggable]="false"
  [resizable]="false"
  styleClass="dialog-sm"
  header="Agregar contacto"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <p class="text-sm text-surface-700 dark:text-surface-300">
      Nuevo contacto para
      <strong class="text-surface-1000 dark:text-surface-0">{{ target()?.name }}</strong
      >.
    </p>

    <div class="field-group">
      <label class="field-label" for="add-contact-name"
        >Nombre<span aria-hidden="true"> *</span></label
      >
      <input
        id="add-contact-name"
        pInputText
        formControlName="name"
        maxlength="100"
        autocomplete="off"
      />
    </div>

    <div class="field-group">
      <label class="field-label" for="add-contact-role">Puesto</label>
      <input
        id="add-contact-role"
        pInputText
        formControlName="role"
        maxlength="100"
        autocomplete="off"
      />
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <div class="field-group">
        <label class="field-label" for="add-contact-phone">Teléfono</label>
        <input
          id="add-contact-phone"
          pInputText
          type="tel"
          formControlName="phone"
          maxlength="20"
          autocomplete="off"
        />
        @if (form.controls.phone.touched && form.controls.phone.errors?.['phone']) {
          <p class="field-error" role="alert">
            Ingresa un número de teléfono válido (10 a 15 dígitos).
          </p>
        }
      </div>
      <div class="field-group">
        <label class="field-label" for="add-contact-email">Correo</label>
        <input
          id="add-contact-email"
          pInputText
          type="email"
          formControlName="email"
          maxlength="254"
          autocomplete="off"
        />
        @if (form.controls.email.touched && form.controls.email.errors?.['email']) {
          <p class="field-error" role="alert">
            Ingresa un correo válido.
          </p>
        }
      </div>
    </div>

    <div class="flex justify-end gap-2">
      <button type="button" class="btn-neutral" (click)="close()" [disabled]="submitting()">
        Cancelar
      </button>
      <button type="submit" class="btn-primary" [disabled]="!canSubmit()">
        @if (submitting()) {
          <span
            class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
            aria-hidden="true"
          ></span>
          Agregando…
        } @else {
          Agregar contacto
        }
      </button>
    </div>
  </form>
</p-dialog>
