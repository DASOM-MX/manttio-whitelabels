<p-dialog
  [visible]="dialogOpen()"
  (visibleChange)="!$event && close()"
  [modal]="true"
  [closable]="!submitting()"
  [draggable]="false"
  [resizable]="false"
  styleClass="dialog-md"
  header="Reprogramar visita"
>
  <div class="grid gap-4">
    <p class="text-sm text-surface-700 dark:text-surface-300">
      Se crea una visita nueva ligada a la cerrada — misma orden, mismo cliente; tú pones la
      nueva fecha.
    </p>

    <form [formGroup]="form" (ngSubmit)="confirm()" class="grid gap-4">
      <div class="grid gap-4 sm:grid-cols-3">
        <div class="field-group">
          <label class="field-label" for="reschedule-date">
            Fecha<span aria-hidden="true"> *</span>
          </label>
          <p-datepicker inputId="reschedule-date" formControlName="fecha" [showIcon]="true" />
        </div>
        <div class="field-group">
          <label class="field-label" for="reschedule-start">
            Hora<span aria-hidden="true"> *</span>
          </label>
          <p-datepicker inputId="reschedule-start" formControlName="horaInicio" [timeOnly]="true" />
        </div>
        <div class="field-group">
          <label class="field-label" for="reschedule-end">Hora fin</label>
          <p-datepicker inputId="reschedule-end" formControlName="horaFin" [timeOnly]="true" />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="reschedule-technician">Técnico</label>
        <p-select
          inputId="reschedule-technician"
          formControlName="technicianId"
          [options]="technicianOptions()"
          optionLabel="label"
          optionValue="value"
          [filter]="true"
          filterBy="label"
        />
      </div>

      <div class="flex justify-end gap-2">
        <button type="button" class="btn-neutral" (click)="close()" [disabled]="submitting()">
          Volver
        </button>
        <button type="submit" class="btn-primary" [disabled]="!canConfirm()">
          @if (submitting()) {
            Programando…
          } @else {
            Programar reemplazo
          }
        </button>
      </div>
    </form>
  </div>
</p-dialog>
