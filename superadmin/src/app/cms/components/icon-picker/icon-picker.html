<button
  type="button"
  class="inline-flex size-11 shrink-0 items-center justify-center rounded-control border border-primary-600/40 bg-white text-surface-700 transition-colors hover:border-primary-600 focus:border-primary-700 focus:outline-none focus:ring-4 focus:ring-primary-700/20 disabled:border-surface-300 disabled:bg-surface-0 disabled:text-surface-400 sm:size-10 dark:border-primary-400/40 dark:bg-surface-900 dark:text-surface-300 dark:hover:border-primary-400 dark:focus:border-primary-400 dark:focus:ring-primary-400/25 dark:disabled:border-surface-700 dark:disabled:bg-surface-800"
  [class.border-dashed]="!value()"
  (click)="grid.toggle($event)"
  [disabled]="disabled()"
  aria-label="Elegir icono"
  title="Elegir icono"
>
  @if (value()) {
    <app-service-icon [icon]="value()" svgClass="size-5" />
  } @else {
    <svg lucidePlus class="size-4 text-surface-400" aria-hidden="true"></svg>
  }
</button>

<p-popover #grid appendTo="body">
  <div class="grid grid-cols-4 gap-1" role="listbox" aria-label="Iconos disponibles">
    @for (option of icons; track option.code) {
      <button
        type="button"
        role="option"
        class="inline-flex size-10 items-center justify-center rounded-full transition-colors"
        [class.bg-primary-100]="value() === option.code"
        [class.text-primary-800]="value() === option.code"
        [class.dark:bg-primary-1000]="value() === option.code"
        [class.dark:text-primary-300]="value() === option.code"
        [class.text-surface-600]="value() !== option.code"
        [class.hover:bg-surface-100]="value() !== option.code"
        [class.dark:text-surface-300]="value() !== option.code"
        [class.dark:hover:bg-surface-800]="value() !== option.code"
        [attr.aria-selected]="value() === option.code"
        [attr.aria-label]="option.label"
        [attr.title]="option.label"
        (click)="pick(option.code, grid)"
      >
        <app-service-icon [icon]="option.code" svgClass="size-5" />
      </button>
    }
  </div>
  @if (value()) {
    <button
      type="button"
      class="mt-2 w-full rounded-md px-2 py-1.5 text-center text-sm font-bold text-red-600 transition-colors hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/30"
      (click)="clear(grid)"
    >
      Quitar icono
    </button>
  }
</p-popover>
