<button
  type="button"
  class="btn-secondary shrink-0"
  (click)="menu.toggle($event)"
  aria-haspopup="true"
  aria-label="Enlaces de contacto"
>
  <svg lucideLink2 class="size-4" aria-hidden="true"></svg>
  <span class="hidden sm:inline">Enlaces de contacto</span>
  <svg lucideChevronDown class="size-4 text-surface-500" aria-hidden="true"></svg>
</button>

<p-popover #menu appendTo="body">
  <div class="w-96 max-w-11/12 py-1">
    @if (!brandLoaded()) {
      <div class="divide-y divide-surface-200 dark:divide-surface-800" aria-hidden="true">
        @for (row of skeletonRows; track row) {
          <div class="flex items-center gap-3 px-4 py-2.5">
            <div class="size-5 shrink-0 rounded bg-surface-200 motion-safe:animate-pulse dark:bg-surface-800"></div>
            <div class="min-w-0 flex-1">
              <div class="h-3.5 w-32 rounded bg-surface-200 motion-safe:animate-pulse dark:bg-surface-800"></div>
              <div class="mt-1.5 h-3 w-56 max-w-full rounded bg-surface-200 motion-safe:animate-pulse dark:bg-surface-800"></div>
            </div>
            <div class="h-10 w-11 shrink-0 rounded-lg bg-surface-200 motion-safe:animate-pulse dark:bg-surface-800"></div>
          </div>
        }
      </div>
    } @else if (links(); as list) {
      <div
        class="divide-y divide-surface-200 dark:divide-surface-800"
        aria-label="Enlaces de contacto por canal"
      >
        @for (link of list; track link.key) {
          <div class="flex items-center gap-3 px-4 py-2.5">
            <svg
              lucideIcon
              [lucideIcon]="link.icon"
              class="size-5 shrink-0 text-surface-600 dark:text-surface-400"
              aria-hidden="true"
            ></svg>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-surface-900 dark:text-surface-100">
                {{ link.label }}
              </p>
              <p class="truncate font-data text-xs text-surface-500 dark:text-surface-400">
                {{ link.url }}
              </p>
            </div>
            <button
              type="button"
              class="row-action"
              (click)="copy(link)"
              [attr.aria-label]="'Copiar enlace de ' + link.label"
            >
              <svg lucideCopy class="size-4" aria-hidden="true"></svg>
            </button>
          </div>
        }
      </div>
    } @else {
      <div class="flex flex-col items-center gap-2 px-4 py-8 text-center">
        <svg lucideGlobe class="size-5 text-surface-400 dark:text-surface-500" aria-hidden="true"></svg>
        <p class="text-sm text-surface-600 dark:text-surface-400">
          El sitio público aún no está aprovisionado.
        </p>
      </div>
    }
  </div>
</p-popover>
