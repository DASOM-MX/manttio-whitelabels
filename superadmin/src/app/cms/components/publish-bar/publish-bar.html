<div class="flex items-center gap-3">
  @if (unpublished()) {
    <span
      class="inline-flex items-center gap-1.5 rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-medium text-amber-900 ring-1 ring-amber-300"
    >
      <svg lucideCircleDot class="size-3" aria-hidden="true"></svg>
      Cambios sin publicar
    </span>
  } @else {
    <span
      class="inline-flex items-center gap-1.5 rounded-full bg-emerald-100 px-2.5 py-0.5 text-xs font-medium text-emerald-900 ring-1 ring-emerald-300"
    >
      <svg lucideCircleDot class="size-3" aria-hidden="true"></svg>
      Publicado
    </span>
  }

  <button
    type="button"
    class="btn-secondary"
    (click)="publish.emit()"
    [disabled]="!unpublished() || busy()"
  >
    <svg lucideSend class="size-4" aria-hidden="true"></svg>
    Publicar
  </button>
</div>
