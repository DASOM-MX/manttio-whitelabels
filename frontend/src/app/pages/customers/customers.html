<div class="min-h-full bg-background">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8 flex flex-col gap-6">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-sky-700">
          Directorio
        </p>
        <h1 class="text-2xl sm:text-3xl font-bold text-granite-900 leading-tight">
          Clientes
        </h1>
      </div>
      <p-button
        routerLink="/customer-add"
        label="Nuevo cliente"
        icon="pi pi-plus"
      ></p-button>
    </div>

    <p-table
      [value]="customers()"
      [paginator]="customers().length > 10"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      sortMode="single"
      [rowHover]="true"
    >
      <ng-template pTemplate="caption">
        <div class="flex items-center gap-3 px-4 py-3 text-granite-900">
          <span class="font-semibold">{{ total() }} cliente{{ total() === 1 ? '' : 's' }}</span>
          @if (loading()) {
            <i class="pi pi-spin pi-spinner text-sky-700" aria-label="Cargando"></i>
          }
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name">Nombre <p-sortIcon field="name"></p-sortIcon></th>
          <th pSortableColumn="identification">RFC <p-sortIcon field="identification"></p-sortIcon></th>
          <th pSortableColumn="phone">Teléfono <p-sortIcon field="phone"></p-sortIcon></th>
          <th pSortableColumn="email">Correo <p-sortIcon field="email"></p-sortIcon></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-c>
        <tr>
          <td class="font-semibold text-granite-900">{{ c.name }}</td>
          <td class="font-data tabular-nums">{{ c.identification ?? '—' }}</td>
          <td class="font-data tabular-nums">{{ c.phone ?? '—' }}</td>
          <td>{{ c.email ?? '—' }}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr class="p-datatable-emptymessage">
          <td colspan="4">Aún no hay clientes.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
