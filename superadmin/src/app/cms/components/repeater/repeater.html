<div class="flex flex-col gap-2" cdkDropList [cdkDropListDisabled]="readOnly()" (cdkDropListDropped)="drop($event)">
  @for (ctrl of array().controls; track ctrl; let i = $index) {
    <div class="flex items-center gap-2" cdkDrag animate.enter="anim-enter">
      <div class="min-w-0 flex-1">
        <ng-container
          *ngTemplateOutlet="rowTemplate(); context: { $implicit: ctrl, index: i }"
        ></ng-container>
      </div>

      @if (!readOnly()) {
        <button
          type="button"
          class="inline-flex size-8 shrink-0 items-center justify-center rounded-md text-red-600 transition-colors hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/30"
          (click)="remove(i)"
          [attr.aria-label]="'Eliminar ' + itemName() + ' ' + (i + 1)"
        >
          <svg lucideTrash2 class="size-4" aria-hidden="true"></svg>
        </button>
        <button
          type="button"
          cdkDragHandle
          class="inline-flex size-8 shrink-0 cursor-grab items-center justify-center rounded-md text-granite-400 transition-colors hover:bg-granite-100 hover:text-granite-700 active:cursor-grabbing dark:text-granite-500 dark:hover:bg-granite-800 dark:hover:text-granite-300"
          (keydown)="onHandleKeydown($event, i)"
          [attr.aria-label]="'Reordenar ' + itemName() + ' ' + (i + 1) + ' (↑/↓ para mover)'"
        >
          <svg lucideGripVertical class="size-4" aria-hidden="true"></svg>
        </button>
      }
    </div>
  } @empty {
    <p
      class="rounded-lg border border-dashed border-granite-300 px-4 py-6 text-center text-sm text-granite-500 dark:border-granite-700 dark:text-granite-400"
    >
      Sin elementos todavía.
    </p>
  }

  @if (!readOnly()) {
    <button
      type="button"
      class="inline-flex items-center gap-2 self-start text-sm font-semibold text-sky-700 transition-colors hover:text-sky-900 dark:text-sky-300 dark:hover:text-sky-200"
      (click)="add.emit()"
    >
      <svg lucidePlus class="size-4" aria-hidden="true"></svg>
      {{ addLabel() }}
    </button>
  }
</div>
