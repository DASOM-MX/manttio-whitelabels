<div class="min-h-screen flex items-center justify-center bg-surface p-4">
    <div class="bg-background rounded-xl shadow-lg border border-gray-200 p-8 w-full max-w-md">
        <!-- Toggle buttons -->
        <!--<div class="flex  rounded-lg p-1 mb-6">
            <button (click)="showRegister = false"
                class="flex-1 px-4 py-2 rounded-lg font-semibold text-sm transition-all duration-200"
                [class]="!showRegister ? 'bg-primary text-white shadow-sm' : 'text-dark hover:bg-gray-200'">
                Iniciar Sesión
            </button>
            <button (click)="showRegister = true"
                class="flex-1 px-4 py-2 rounded-lg font-semibold text-sm transition-all duration-200"
                [class]="showRegister ? 'bg-primary text-white shadow-sm' : 'text-dark hover:bg-gray-200'">
                Registrarse
            </button>
        </div>-->

        <img src="assets/logo.jpg" alt="Logo" class="w-32 h-auto mb-6 mx-auto">

        <!-- Login Form -->
        <div *ngIf="!showRegister">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <h2 class="text-2xl font-bold text-center text-dark mb-10">
                    Iniciar Sesión
                </h2>

                <div class="mb-6 ">
                    <input type="email" formControlName="email"
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm transition-colors duration-200 bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10"
                        [class.border-red-500]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
                        placeholder="Email" />
                    <div class="text-red-500 text-xs mt-2 flex items-center gap-1"
                        *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                        <span>⚠</span>
                        <span *ngIf="loginForm.get('email')?.hasError('required')">El email es obligatorio.</span>
                        <span *ngIf="loginForm.get('email')?.hasError('email')">Ingresa un email válido.</span>
                    </div>
                </div>

                <div class="mb-[80px]">
                    <input type="password" formControlName="password"
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm transition-colors duration-200 bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10"
                        [class.border-red-500]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                        placeholder="Contraseña" />
                    <div class="text-red-500 text-xs mt-2 flex items-center gap-1"
                        *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                        <span>⚠</span>
                        <span *ngIf="loginForm.get('password')?.hasError('required')">La contraseña es
                            obligatoria.</span>
                        <span *ngIf="loginForm.get('password')?.hasError('minlength')">La contraseña debe tener al menos
                            8 caracteres.</span>
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-primary text-white py-3 rounded-xl font-semibold text-sm transition-colors duration-200 hover:bg-secondary disabled:opacity-50 disabled:cursor-not-allowed"
                    [disabled]="loginForm.invalid">
                    Entrar
                </button>
            </form>
        </div>

        <!-- Register Form -->
        <div *ngIf="showRegister">
            <app-register></app-register>
        </div>
    </div>
</div>
