<div class="min-h-screen flex items-center justify-center bg-surface p-4">



    <div class="max-w-xl mx-auto p-6 bg-white shadow-md rounded-xl w-full">
        <h2 class="text-xl font-bold mb-4">Nuevo Reporte</h2>

        <!--Report type selector-->
        <label class="block mb-2 font-medium">Tipo de reporte</label>
        <select [(ngModel)]="selectedReportType" class="border p-2 rounded mb-4 w-full">
            <option *ngFor="let type of reportTypes" [value]="type">
                {{ type | titlecase }}
            </option>
        </select>

        <div [ngClass]="{'opacity-0 scale-95': isAnimating, 'opacity-100 scale-100': !isAnimating}"
            class="transition-all duration-500 ease-in-out transform space-y-1 mb-4">
            <div class="space-y-1 mb-4">

                <label class="block font-semibold text-dark">
                    Cliente
                </label>
                <select id="customer" name="customer_id" [(ngModel)]="selectedCustomerId"
                    class="w-full border p-2 rounded">
                    <option *ngFor="let customer of customers" [value]="customer.id">
                        {{ customer.name }} - {{ customer.identification }}
                    </option>
                </select>

            </div>


            <app-dynamic-form [fields]="formFields" (submitForm)="onFormSubmit($event)"
                (filesSelected)="onFilesSelected($event) "></app-dynamic-form>
        </div>


    </div>
</div>
