<div class="min-h-full bg-background">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 py-8 flex flex-col gap-6">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-sky-700">
          Editar
        </p>
        <h1 class="text-2xl sm:text-3xl font-bold text-granite-900 leading-tight">
          {{ customer()?.name ?? 'Cliente' }}
        </h1>
      </div>
      <p-button
        routerLink="/customers"
        label="Volver"
        icon="pi pi-arrow-left"
        severity="secondary"
        [text]="true"
      ></p-button>
    </div>

    @if (formFields(); as fields) {
      <div class="card-section">
        <app-dynamic-form [fields]="fields" (submitForm)="onFormSubmit($event)"></app-dynamic-form>
      </div>
    } @else {
      <div class="card-section flex items-center gap-3 text-granite-700">
        <i class="pi pi-spin pi-spinner text-sky-700"></i>
        <span>Cargando cliente…</span>
      </div>
    }
  </div>
</div>
