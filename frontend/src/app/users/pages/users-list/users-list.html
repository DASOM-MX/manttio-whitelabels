<div class="min-h-full bg-background dark:bg-granite-950">
  <div class="max-w-5xl mx-auto px-4 sm:px-8 py-10 sm:py-12 flex flex-col gap-8">
    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-5">
      <div class="flex flex-col gap-1">
        <p class="text-sm font-bold uppercase tracking-wider text-sky-800 dark:text-sky-300">
          Administración
        </p>
        <h1
          class="text-3xl sm:text-4xl font-extrabold text-granite-950 dark:text-granite-50 leading-tight tracking-tight"
        >
          Usuarios
        </h1>
      </div>
      <p-button
        routerLink="/users/add"
        label="Nuevo usuario"
        icon="pi pi-plus"
      ></p-button>
    </div>

    <!-- Users table -->
    <p-table
      #dt
      [value]="users()"
      [paginator]="users().length > 10"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      sortMode="single"
      [rowHover]="true"
    >
      <ng-template pTemplate="caption">
        <div class="border-b border-granite-200 dark:border-granite-700">
          <button
            type="button"
            (click)="toggleFilters()"
            [attr.aria-expanded]="filtersOpen()"
            class="w-full flex items-center justify-between gap-4 px-5 py-4 text-left hover:bg-granite-100 active:bg-granite-200 dark:hover:bg-granite-800 dark:active:bg-granite-700 transition-colors"
          >
            <div class="flex items-center gap-3 min-w-0">
              <i class="pi pi-filter text-sky-800 dark:text-sky-300 text-lg"></i>
              <span class="text-lg font-bold text-granite-950 dark:text-granite-50">Filtros</span>
              @if (activeFilterCount() > 0) {
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full bg-sky-700 text-white text-sm font-bold">
                  {{ activeFilterCount() }}
                </span>
              }
              <span class="text-base text-granite-700 dark:text-granite-300 truncate">
                · {{ total() }} usuario{{ total() === 1 ? "" : "s" }}
              </span>
              @if (loading()) {
                <i class="pi pi-spin pi-spinner text-sky-800 dark:text-sky-300" aria-label="Cargando"></i>
              }
            </div>
            <i
              class="pi pi-chevron-down text-granite-800 dark:text-granite-200 text-lg transition-transform duration-200"
              [class.rotate-180]="filtersOpen()"
            ></i>
          </button>

          @if (filtersOpen()) {
            <form
              [formGroup]="filtersForm"
              class="px-5 pb-5 pt-2 flex flex-col gap-5"
            >
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-4">
                <div class="field-group sm:col-span-2">
                  <label for="searchFilter" class="field-label">Buscar</label>
                  <input
                    id="searchFilter"
                    type="text"
                    pInputText
                    formControlName="search"
                    placeholder="Nombre, correo o rol"
                    class="w-full"
                  />
                </div>
                <div class="field-group sm:col-span-2">
                  <label for="roleFilter" class="field-label">Rol</label>
                  <p-select
                    inputId="roleFilter"
                    formControlName="role"
                    [options]="roleOptions"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Todos"
                    [showClear]="true"
                    [autoOptionFocus]="false"
                    styleClass="w-full"
                  >
                  </p-select>
                </div>
              </div>
              <div class="flex justify-end">
                @if (activeFilterCount() > 0) {
                  <button
                    type="button"
                    class="text-base font-bold text-sky-800 dark:text-sky-300 hover:text-sky-900 inline-flex items-center gap-2 py-2 px-3 rounded-lg hover:bg-sky-50 transition-colors"
                    (click)="clearFilters()"
                  >
                    <i class="pi pi-times"></i>
                    Limpiar filtros
                  </button>
                }
              </div>
            </form>
          }
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name">Nombre <p-sortIcon field="name"></p-sortIcon></th>
          <th pSortableColumn="email">Correo <p-sortIcon field="email"></p-sortIcon></th>
          <th pSortableColumn="role">Rol <p-sortIcon field="role"></p-sortIcon></th>
          <th pSortableColumn="createdAt">Creado <p-sortIcon field="createdAt"></p-sortIcon></th>
          <th class="text-right">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-u>
        <tr (click)="goToEdit(u.id)" class="cursor-pointer">
          <td class="font-semibold text-granite-950 dark:text-granite-50">
            <div class="flex items-center gap-2">
              <span>{{ u.name }}</span>
              @if (u.isSelf) {
                <span class="inline-flex items-center px-2 py-0.5 rounded-full bg-sky-100 dark:bg-sky-950/40 text-sky-800 dark:text-sky-300 text-xs font-bold">
                  tú
                </span>
              }
            </div>
          </td>
          <td class="font-data tabular-nums">{{ u.email }}</td>
          <td>
            @if (u.role === 'admin') {
              <p-tag severity="info" value="Administrador"></p-tag>
            } @else {
              <p-tag severity="success" value="Técnico"></p-tag>
            }
          </td>
          <td class="font-data tabular-nums text-granite-800 dark:text-granite-200">
            {{ u.createdAt | date: 'shortDate' }}
          </td>
          <td class="text-right">
            <div class="inline-flex items-center gap-1">
              <button
                type="button"
                pTooltip="Editar"
                tooltipPosition="top"
                aria-label="Editar"
                (click)="$event.stopPropagation(); goToEdit(u.id)"
                class="size-9 inline-flex items-center justify-center rounded-lg text-sky-800 dark:text-sky-300 hover:bg-sky-50 active:bg-sky-100 transition-colors"
              >
                <i class="pi pi-pencil"></i>
              </button>
              @if (!u.isSelf) {
                <button
                  type="button"
                  pTooltip="Eliminar"
                  tooltipPosition="top"
                  aria-label="Eliminar"
                  (click)="askDelete($event, u)"
                  class="size-9 inline-flex items-center justify-center rounded-lg text-red-700 dark:text-red-400 hover:bg-red-50 active:bg-red-100 transition-colors"
                >
                  <i class="pi pi-trash"></i>
                </button>
              }
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr class="p-datatable-emptymessage">
          <td colspan="5">Aún no hay usuarios.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<app-delete-user-dialog #deleteDialog />
