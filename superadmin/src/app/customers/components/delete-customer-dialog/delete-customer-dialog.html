<p-dialog
  [visible]="dialogOpen()"
  (visibleChange)="!$event && close()"
  [modal]="true"
  [closable]="!submitting()"
  [draggable]="false"
  [resizable]="false"
  styleClass="dialog-sm"
  header="Eliminar cliente"
>
  <form [formGroup]="form" (ngSubmit)="confirm()" class="flex flex-col gap-4">
    <p class="text-sm text-surface-700 dark:text-surface-300">
      Vas a eliminar a
      <strong class="text-surface-1000 dark:text-surface-0">{{ target()?.name }}</strong
      >. Sus reportes e historial se conservan; la eliminación queda auditada.
    </p>

    <div class="field-group">
      <label class="field-label" for="customer-delete-comment"
        >Motivo (auditoría)<span aria-hidden="true"> *</span></label
      >
      <textarea
        id="customer-delete-comment"
        pTextarea
        formControlName="comment"
        rows="2"
      ></textarea>
    </div>

    <div class="flex justify-end gap-2">
      <button type="button" class="btn-neutral" (click)="close()" [disabled]="submitting()">
        Cancelar
      </button>
      <button type="submit" class="btn-danger" [disabled]="!canConfirm()">
        @if (submitting()) {
          <span
            class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
            aria-hidden="true"
          ></span>
          Eliminando…
        } @else {
          Eliminar cliente
        }
      </button>
    </div>
  </form>
</p-dialog>
