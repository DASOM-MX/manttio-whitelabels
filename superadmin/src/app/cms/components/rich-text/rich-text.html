<div class="field-shell">
  <div
    class="flex items-center gap-0.5 border-b border-surface-200 px-2 py-1.5 dark:border-surface-800"
    role="toolbar"
    aria-label="Formato"
  >
    <button
      type="button"
      class="row-action size-8"
      (click)="exec('bold')"
      [disabled]="disabled()"
      aria-label="Negritas"
    >
      <svg lucideBold class="size-4" aria-hidden="true"></svg>
    </button>
    <button
      type="button"
      class="row-action size-8"
      (click)="exec('italic')"
      [disabled]="disabled()"
      aria-label="Cursivas"
    >
      <svg lucideItalic class="size-4" aria-hidden="true"></svg>
    </button>
    <button
      type="button"
      class="row-action size-8"
      (click)="exec('insertUnorderedList')"
      [disabled]="disabled()"
      aria-label="Lista con viñetas"
    >
      <svg lucideList class="size-4" aria-hidden="true"></svg>
    </button>
  </div>

  <div
    #editor
    [id]="controlId()"
    class="prose-sm min-h-28 max-w-none px-4 py-2.5 text-base text-surface-1000 focus:outline-none sm:text-sm [&_ul]:list-disc [&_ul]:pl-5 dark:text-surface-0"
    [attr.contenteditable]="disabled() ? 'false' : 'true'"
    role="textbox"
    aria-multiline="true"
    [attr.aria-label]="ariaLabel()"
    (input)="onInput()"
    (blur)="onBlur()"
    (paste)="onPaste($event)"
  ></div>
</div>
