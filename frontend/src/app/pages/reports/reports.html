<div class="min-h-screen bg-background pb-24">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8 space-y-6">
        <!-- Header -->
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
                <p class="text-xs font-semibold uppercase tracking-wide text-sky-700">Mantenimiento</p>
                <h1 class="text-2xl sm:text-3xl font-bold text-granite-900 leading-tight">
                    Reportes
                </h1>
            </div>
            <button type="button" routerLink="/report-add" class="btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
                Nuevo reporte
            </button>
        </div>

        <!-- Sort segmented control -->
        <div class="flex flex-wrap gap-2" role="group" aria-label="Ordenar reportes">
            <button type="button" (click)="sortReports('date')"
                class="inline-flex items-center gap-1.5 min-h-11 px-4 py-2 rounded-full text-sm font-semibold border-2 border-granite-200 bg-white text-granite-800 hover:bg-sky-50 hover:border-sky-300 active:bg-sky-100 transition-colors">
                Fecha
                <span aria-hidden="true">↑</span>
            </button>
            <button type="button" (click)="sortReports('client-asc')"
                class="inline-flex items-center gap-1.5 min-h-11 px-4 py-2 rounded-full text-sm font-semibold border-2 border-granite-200 bg-white text-granite-800 hover:bg-sky-50 hover:border-sky-300 active:bg-sky-100 transition-colors">
                Cliente A–Z
            </button>
            <button type="button" (click)="sortReports('client-desc')"
                class="inline-flex items-center gap-1.5 min-h-11 px-4 py-2 rounded-full text-sm font-semibold border-2 border-granite-200 bg-white text-granite-800 hover:bg-sky-50 hover:border-sky-300 active:bg-sky-100 transition-colors">
                Cliente Z–A
            </button>
        </div>

        <!-- Reports table -->
        <div class="card overflow-hidden">
            <div class="w-full overflow-x-auto">
                <table class="min-w-full">
                    <thead class="bg-navy-900 text-white">
                        <tr>
                            <th scope="col"
                                class="px-4 sm:px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">
                                ID
                            </th>
                            <th scope="col"
                                class="px-4 sm:px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">
                                Tipo
                            </th>
                            <th scope="col"
                                class="px-4 sm:px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">
                                Cliente
                            </th>
                            <th scope="col"
                                class="px-4 sm:px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">
                                Fecha
                            </th>
                            <th scope="col"
                                class="px-4 sm:px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">
                                Estado
                            </th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-granite-200 bg-white">
                        <tr *ngFor="let r of reports" (click)="goToReportDetail(r.id)"
                            class="cursor-pointer hover:bg-sky-50 active:bg-sky-100 transition-colors duration-100 even:bg-granite-50/40">
                            <td class="px-4 sm:px-6 py-5 whitespace-nowrap text-base font-data tabular-nums font-semibold text-granite-900">
                                {{ r.id | slice:0:6 }}{{ r.id.length > 8 ? '…' : ''}}
                            </td>
                            <td class="px-4 sm:px-6 py-5 whitespace-nowrap text-base text-granite-800 capitalize">
                                {{ r.manttio_type }}
                            </td>
                            <td class="px-4 sm:px-6 py-5 whitespace-nowrap text-base text-granite-800">
                                {{ r.client_name }}
                            </td>
                            <td class="px-4 sm:px-6 py-5 whitespace-nowrap text-base font-data tabular-nums text-granite-800">
                                {{ r.date_departure | date:'shortDate' }}
                            </td>
                            <td class="px-4 sm:px-6 py-5 whitespace-nowrap">
                                <span *ngIf="r.report_status; else pending"
                                    class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-100 text-emerald-900 text-sm font-bold">
                                    <span class="size-2 rounded-full bg-emerald-600" aria-hidden="true"></span>
                                    Finalizado
                                </span>
                                <ng-template #pending>
                                    <span
                                        class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-100 text-amber-900 text-sm font-bold">
                                        <span class="size-2 rounded-full bg-amber-600" aria-hidden="true"></span>
                                        Pendiente
                                    </span>
                                </ng-template>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Empty state -->
            <div *ngIf="!reports?.length" class="px-6 py-12 text-center">
                <p class="text-base text-granite-600">Aún no hay reportes.</p>
            </div>
        </div>
    </div>
</div>
