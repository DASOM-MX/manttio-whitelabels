<div
  class="flex min-h-12 flex-wrap items-center gap-1.5 rounded-lg border-2 border-surface-200 bg-white px-2.5 py-1.5 transition-colors focus-within:border-primary-700 focus-within:ring-4 focus-within:ring-primary-700/20 dark:border-surface-700 dark:bg-surface-900 dark:focus-within:border-primary-400 dark:focus-within:ring-primary-400/25"
>
  @for (tag of tags(); track tag; let i = $index) {
    <span
      class="inline-flex items-center gap-1 rounded-full bg-primary-100 px-2.5 py-0.5 text-xs font-medium text-primary-900 ring-1 ring-primary-300"
    >
      {{ tag }}
      @if (!disabled()) {
        <button
          type="button"
          class="inline-flex size-4 items-center justify-center rounded-full transition-colors hover:bg-primary-200"
          (click)="remove(i)"
          [attr.aria-label]="'Quitar etiqueta ' + tag"
        >
          <svg lucideX class="size-3" aria-hidden="true"></svg>
        </button>
      }
    </span>
  }
  <input
    [id]="controlId()"
    type="text"
    class="min-w-24 flex-1 border-0 bg-transparent py-1 text-base text-surface-1000 placeholder:text-surface-400 focus:outline-none focus:ring-0 disabled:cursor-not-allowed dark:text-surface-0"
    [disabled]="disabled()"
    placeholder="Agregar etiqueta…"
    autocomplete="off"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (change)="onChangeEvent($event)"
    (blur)="onBlur()"
  />
</div>
