<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    <ng-container *ngFor="let field of fields">
        <div>
            <label class="field-label" [attr.for]="field.name">
                {{ field.label }}
            </label>

            <ng-container [ngSwitch]="field.type">
                <input *ngSwitchCase="'text'" type="text" [id]="field.name" [formControlName]="field.name"
                    class="field-input" />

                <input *ngSwitchCase="'number'" type="number" [id]="field.name" [formControlName]="field.name"
                    inputmode="decimal" class="field-input" />

                <select *ngSwitchCase="'select'" [id]="field.name" [formControlName]="field.name" class="field-input">
                    <option *ngFor="let option of field.options" [value]="option">{{ option }}</option>
                </select>

                <input *ngSwitchCase="'datetime-local'" type="datetime-local" [id]="field.name"
                    [formControlName]="field.name" class="field-input" />

                <app-image-picker *ngSwitchCase="'image'"
                    (filesSelected)="onFilesSelected($event)"></app-image-picker>

                <app-signature *ngSwitchCase="'signature'"
                    (signatureChanged)="onSignatureChanged($event)"></app-signature>

                <div *ngSwitchDefault class="text-sm font-semibold text-red-700">
                    Tipo no soportado: {{ field.type }}
                </div>
            </ng-container>
        </div>
    </ng-container>

    <button type="submit" class="btn-primary w-full">
        Enviar
    </button>
</form>
