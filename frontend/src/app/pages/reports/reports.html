<div class="min-h-screen flex items-center justify-center bg-surface p-4">
    <div class="w-full max-w-4xl flex flex-col space-y-6">
        <!-- Título con tamaño responsivo y texto justificado en pantallas grandes -->
        <div class="flex items-center  gap-2 px-2 md:px-0">
            <h2 class="text-lg sm:text-xl md:text-2xl font-bold text-dark leading-tight">
                Reportes de Mantenimiento
            </h2>

            <button type="button" routerLink="/report-add"
                class="inline-flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-full hover:bg-primary/80 transition">
                <!-- Ícono Heroicons: plus -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>

                Crear
            </button>
        </div>

        <hr class="border-t border-gray-300 my-4">
        <!-- Botones de ordenamiento -->
        <div class="flex justify-start gap-2 mb-4 w-full">
            <button type="button" (click)="sortReports('date')"
                class="px-4 py-2  text-primary border-2 border-primary rounded hover:bg-primary/80 hover:text-white transition">
                Ordenar por Fecha ↑
            </button>

            <button type="button " (click)="sortReports('client-asc')"
                class="px-4 py-2  text-primary border-2 border-primary rounded hover:bg-primary/80 hover:text-white transition">
                Ordenar por Cliente A-Z
            </button>
            <button type="button" (click)="sortReports('client-desc')"
                class="px-4 py-2 text-primary border-2 border-primary rounded hover:bg-primary/80 hover:text-white transition">
                Ordenar por Cliente Z-A
            </button>
        </div>


        <div class="w-full overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 rounded border border-gray-200 shadow-sm overflow-hidden">
                <thead class="bg-dark text-white">
                    <tr>
                        <th
                            class="px-4 sm:px-6 py-3 text-left text-xs sm:text-sm font-semibold uppercase tracking-wider">
                            ID
                        </th>
                        <th
                            class="px-4 sm:px-6 py-3 text-left text-xs sm:text-sm font-semibold  uppercase tracking-wider">
                            Tipo
                        </th>
                        <th
                            class="px-4 sm:px-6 py-3 text-left text-xs sm:text-sm font-semibold  uppercase tracking-wider">
                            Cliente
                        </th>
                        <th
                            class="px-4 sm:px-6 py-3 text-left text-xs sm:text-sm font-semibold uppercase tracking-wider">
                            Fecha
                        </th>
                        <th
                            class="px-4 sm:px-6 py-3 text-left text-xs sm:text-sm font-semibold uppercase tracking-wider">
                            Status
                        </th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr *ngFor="let r of reports" (click)="goToReportDetail(r.id)"
                        class="hover:bg-gray-100 transition-colors duration-150 cursor-pointer">
                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap text-sm sm:text-base text-gray-900">
                            {{ r.id | slice:0:6 }}{{ r.id.length > 8 ? '...' : ''}}
                        </td>
                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap text-sm sm:text-base text-gray-900">
                            {{ r.manttio_type }}
                        </td>
                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap text-sm sm:text-base text-gray-900">
                            {{ r.client_name }}
                        </td>
                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap text-sm sm:text-base text-gray-900">
                            {{ r.date_departure | date:'shortDate' }}
                        </td>
                        <td>
                            <span *ngIf="r.report_status; else pending"
                                class="px-2 py-1 rounded bg-green-200 text-green-800 font-semibold">
                                Finalizado
                            </span>
                            <ng-template #pending>
                                <span class="px-2 py-1 rounded bg-yellow-200 text-yellow-800 font-semibold">
                                    Pendiente
                                </span>
                            </ng-template>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
