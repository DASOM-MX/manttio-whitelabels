<div class="min-h-screen bg-background pb-24">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8 space-y-6">
        <!-- Header -->
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
                <p class="text-xs font-semibold uppercase tracking-wide text-sky-700">Mantenimiento</p>
                <h1 class="text-2xl sm:text-3xl font-bold text-granite-900 leading-tight">
                    Reportes
                </h1>
            </div>
            <p-button routerLink="/report-add" label="Nuevo reporte" icon="pi pi-plus"></p-button>
        </div>

        <!-- Reports table -->
        <p-table [value]="reports" [paginator]="reports.length > 10" [rows]="10"
            [rowsPerPageOptions]="[10, 25, 50]" [globalFilterFields]="['id', 'manttio_type', 'client_name']"
            [tableStyle]="{ 'min-width': '100%' }" sortMode="single" [rowHover]="true"
            (onRowSelect)="goToReportDetail($event.data.id)" selectionMode="single">
            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="id">
                        ID <p-sortIcon field="id"></p-sortIcon>
                    </th>
                    <th pSortableColumn="manttio_type">
                        Tipo <p-sortIcon field="manttio_type"></p-sortIcon>
                    </th>
                    <th pSortableColumn="client_name">
                        Cliente <p-sortIcon field="client_name"></p-sortIcon>
                    </th>
                    <th pSortableColumn="date_departure">
                        Fecha <p-sortIcon field="date_departure"></p-sortIcon>
                    </th>
                    <th pSortableColumn="report_status">
                        Estado <p-sortIcon field="report_status"></p-sortIcon>
                    </th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-r>
                <tr [pSelectableRow]="r" (click)="goToReportDetail(r.id)" class="cursor-pointer">
                    <td class="font-data tabular-nums font-semibold text-granite-900">
                        {{ r.id | slice:0:6 }}{{ r.id.length > 8 ? '…' : '' }}
                    </td>
                    <td class="capitalize">{{ r.manttio_type }}</td>
                    <td>{{ r.client_name }}</td>
                    <td class="font-data tabular-nums">{{ r.date_departure | date:'shortDate' }}</td>
                    <td>
                        <p-tag *ngIf="r.report_status; else pending" severity="success" value="Finalizado"></p-tag>
                        <ng-template #pending>
                            <p-tag severity="warn" value="Pendiente"></p-tag>
                        </ng-template>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="5" class="p-datatable-empty-message">Aún no hay reportes.</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
