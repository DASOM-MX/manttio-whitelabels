name = "manttio-api"
main = "src/index.ts"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

# Brand identity (name, logos, colors, site URL, contact) is DATA, not config —
# it lives in the `brand` table and is served by GET /brand (fork rule: no
# hardcoded tenant brand in shipped code/config). The vars below are per-deploy
# INFRA only. The retired BRAND_* values were migrated into the brand row via
# the whitelabel manager's shared-token push.
[vars]
ENVIRONMENT = "dev"
CDN_BASE_URL = "https://cdn.dasom.com"
# Public base of the `manttio-logos` bucket (brand images + generated PWA
# icons). Placeholder until the bucket's public/custom domain exists — set it
# before provisioning the brand (deploy checklist, plan 02).
LOGOS_CDN_BASE_URL = "https://logos.dasom.com"
# Public base of the `manttio-images` bucket (public marketing imagery uploaded
# via POST /upload/website-image — service catalog photos). Same placeholder
# posture as LOGOS_CDN_BASE_URL: the bucket exists, its custom domain does not
# yet. Optional in code — unset, the API omits image URLs rather than emitting
# broken ones, so a tenant deploy without it degrades to text-only cards.
IMAGES_CDN_BASE_URL = "https://images.dasom.com"
# Public base of the `manttio-wms-evidence` bucket (replenishment evidence
# photos). Repeated under [env.production.vars]: `vars` is not inheritable — a
# production table replaces the top-level one wholesale, so anything missing
# from it is undefined at deploy.
WMS_EVIDENCE_CDN_BASE_URL = "https://wms.dasom.com"
API_BASE_URL = "http://127.0.0.1:8787"
PORTAL_BASE_URL = "http://127.0.0.1:4200"
RESEND_FROM = "no-reply@dasom.com"
# Cloudflare Turnstile server-side verification endpoint (POST /public/leads).
TURNSTILE_SITEVERIFY_URL = "https://challenges.cloudflare.com/turnstile/v0/siteverify"
# FONT_CDN_BASE_URL — CDN fronting the shared `branding-fonts` bucket. Optional:
# until it exists, GET /fonts serves entries without hosted files (the two
# default families are bundled by every consumer).
# FONT_CDN_BASE_URL = "https://<branding-fonts-cdn>"
# NOTIFICATIONS_RETENTION_MONTHS — months the daily sweep keeps notification
# rows (optional; code defaults to 8). Declare here AND in
# [env.production.vars] if a tenant ever needs a different window.

# Daily notifications retention sweep (notifications plan §2.4) — hard-deletes
# notification rows older than the retention window via scheduled() in
# src/index.ts. `triggers` is a wrangler-inheritable key: production reuses it.
[triggers]
crons = ["0 4 * * *"]

[[r2_buckets]]
binding = "MANTTIO_REPORTS"
bucket_name = "manttio-reports"

[[r2_buckets]]
binding = "MANTTIO_LOGOS"
bucket_name = "manttio-logos"

[[r2_buckets]]
binding = "MANTTIO_EQUIPMENT"
bucket_name = "manttio-equipment"

# Public marketing-site imagery (service catalog photos) — its own bucket, the
# same posture brand assets get (owner 2026-07-26). The bucket predates this
# binding; its public base is IMAGES_CDN_BASE_URL (per-deploy, see below).
[[r2_buckets]]
binding = "MANTTIO_IMAGES"
bucket_name = "manttio-images"

# Contract documents (13) — again its own bucket: a signed contract has a
# different retention and audience from report photos or site imagery. This one
# is **private**: attach no r2.dev domain and no custom domain. There is no
# CONTRACTS_CDN_BASE_URL by design — the backend streams the file itself.
[[r2_buckets]]
binding = "MANTTIO_CONTRACTS"
bucket_name = "manttio-contracts"

# WMS import source sheets (10-wms/02 §8, owner 2026-07-20) — TRANSIENT: the
# upload is a copy the tenant still holds, so the binary is purged once the
# consumer has parsed it (01 §4) and only the key/name survive as the reference.
# Private by design: no CDN base, nothing reads it but the queue consumer.
[[r2_buckets]]
binding = "MANTTIO_WMS_SHEETS"
bucket_name = "manttio-wms-sheets"

# WMS replenishment evidence photos — PERMANENT, and its own bucket for the same
# reason equipment photos got one: different retention, different audience. Its
# public base is WMS_EVIDENCE_CDN_BASE_URL (per-deploy, below).
[[r2_buckets]]
binding = "MANTTIO_WMS_EVIDENCE"
bucket_name = "manttio-wms-evidence"

# Import processing (11 §1). The message carries the import id only — the file
# stays in R2 and the mapping in the DB, so the 128 KB cap is never in play.
# Queues are ACCOUNT-level, so a second tenant on this account needs its own
# queue name, exactly like the buckets above.
[[queues.producers]]
binding = "WMS_IMPORT_QUEUE"
queue = "manttio-wms-imports"

# 1 req/min per IP on POST /public/leads (Workers rate-limiting API). Best-effort
# per-colo counting — an abuse dial, not a strict quota. Optional binding: the
# controller fails open when it is absent.
[[unsafe.bindings]]
name = "LEADS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 1, period = 60 }

# Production deploy: `wrangler deploy --env production`.
# Wrangler v4 inherits top-level config; only the overrides live here.
[env.production.vars]
ENVIRONMENT = "production"
CDN_BASE_URL = "https://cdn.dasom.com"
LOGOS_CDN_BASE_URL = "https://logos.dasom.com"
IMAGES_CDN_BASE_URL = "https://images.dasom.com"
WMS_EVIDENCE_CDN_BASE_URL = "https://wms.dasom.com"
API_BASE_URL = "https://api.dasom.com"
PORTAL_BASE_URL = "https://portal.dasom.com"
RESEND_FROM = "no-reply@dasom.com"
TURNSTILE_SITEVERIFY_URL = "https://challenges.cloudflare.com/turnstile/v0/siteverify"

[[env.production.r2_buckets]]
binding = "MANTTIO_REPORTS"
bucket_name = "manttio-reports"

[[env.production.r2_buckets]]
binding = "MANTTIO_LOGOS"
bucket_name = "manttio-logos"

[[env.production.r2_buckets]]
binding = "MANTTIO_EQUIPMENT"
bucket_name = "manttio-equipment"

[[env.production.r2_buckets]]
binding = "MANTTIO_IMAGES"
bucket_name = "manttio-images"

[[env.production.r2_buckets]]
binding = "MANTTIO_CONTRACTS"
bucket_name = "manttio-contracts"

[[env.production.r2_buckets]]
binding = "MANTTIO_WMS_SHEETS"
bucket_name = "manttio-wms-sheets"

[[env.production.r2_buckets]]
binding = "MANTTIO_WMS_EVIDENCE"
bucket_name = "manttio-wms-evidence"

[[env.production.queues.producers]]
binding = "WMS_IMPORT_QUEUE"
queue = "manttio-wms-imports"

[[env.production.unsafe.bindings]]
name = "LEADS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 1, period = 60 }

# Secrets / per-deploy env are set via `wrangler secret put [--env production]`
# (and `.dev.vars` locally) and are NOT declared here:
#   DATABASE_URL            Neon Postgres connection string
#   JWT_SECRET              HS256 signing secret for jose (staff tokens)
#   PORTAL_JWT_SECRET       HS256 signing secret for portal tokens (separate surface)
#   RESEND_API_KEY          Resend API key for outbound report emails
#   MANAGER_SHARED_TOKEN    shared secret for the whitelabel manager's config
#                           pushes (X-Manager-Token on PUT /brand + /upload/image)
#   EQUIPMENT_CDN_BASE_URL  public base of the `manttio-equipment` bucket that
#                           /upload/equipment returns + persists in equipment.photos
#                           (S3 endpoint / r2.dev / custom domain — kept per-deploy,
#                           out of committed config)
#   TURNSTILE_SECRET_KEY    Cloudflare Turnstile secret for siteverify on
#                           POST /public/leads (dev: always-pass test secret,
#                           see .dev.vars.example)
