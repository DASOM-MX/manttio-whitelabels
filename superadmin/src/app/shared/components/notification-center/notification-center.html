<button
  type="button"
  class="relative inline-flex size-10 items-center justify-center rounded-lg text-granite-700 transition-colors hover:bg-granite-100 dark:text-granite-300 dark:hover:bg-granite-800"
  (click)="panel.toggle($event)"
  [attr.aria-label]="bellAria()"
  aria-haspopup="true"
>
  <svg lucideBell class="size-5" aria-hidden="true"></svg>
  @if (hasUnread()) {
    <span
      class="absolute right-1 top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-sky-600 px-1 text-[10px] font-semibold leading-none text-white dark:bg-sky-500"
      aria-hidden="true"
    >
      {{ badgeText() }}
    </span>
  }
</button>

<p-popover #panel appendTo="body">
  <div class="flex w-80 flex-col sm:w-96">
    <div
      class="flex h-11 items-center justify-between gap-2 border-b border-granite-200 px-4 dark:border-granite-800"
    >
      <p class="micro-label">Notificaciones</p>
      @if (hasUnread()) {
        <button
          type="button"
          class="text-[13px] font-medium text-sky-700 transition-colors hover:text-sky-900 dark:text-sky-400 dark:hover:text-sky-300"
          (click)="markAllRead()"
        >
          Marcar todas como leídas
        </button>
      }
    </div>

    @if (recent().length === 0) {
      <div class="flex flex-col items-center gap-2 px-4 py-8 text-center">
        <svg lucideBellOff class="size-6 text-granite-400" aria-hidden="true"></svg>
        <p class="text-sm text-granite-500 dark:text-granite-400">Sin notificaciones por ahora.</p>
      </div>
    } @else {
      <ul class="max-h-96 overflow-y-auto py-1">
        @for (row of recent(); track row.n.id) {
          <li>
            <button
              type="button"
              class="relative flex w-full items-start gap-3 px-4 py-2.5 text-left transition-colors hover:bg-granite-100 dark:hover:bg-granite-800"
              [class.bg-granite-50]="row.unread"
              [class.dark:bg-granite-950/60]="row.unread"
              (click)="onItemClick(row.n, panel)"
            >
              @if (row.unread) {
                <span
                  class="absolute inset-y-1 left-0 w-0.5 rounded-full bg-sky-600 dark:bg-sky-400"
                  aria-hidden="true"
                ></span>
              }
              @if (row.n.type | notificationTypeIcon; as icon) {
                <span
                  class="mt-0.5 inline-flex size-7 shrink-0 items-center justify-center rounded-full bg-granite-100 text-granite-600 dark:bg-granite-800 dark:text-granite-400"
                >
                  <svg lucideIcon [lucideIcon]="icon" class="size-4" aria-hidden="true"></svg>
                </span>
              }
              <span class="min-w-0 flex-1">
                <span class="block truncate text-sm font-medium text-granite-900 dark:text-granite-100">
                  {{ row.n.title }}
                </span>
                <span class="mt-0.5 line-clamp-2 block text-[13px] leading-snug text-granite-600 dark:text-granite-400">
                  {{ row.n.body }}
                </span>
                <span class="mt-1 block text-xs text-granite-500 dark:text-granite-500">
                  {{ row.n.createdAt | relativeTime }}
                </span>
              </span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</p-popover>
