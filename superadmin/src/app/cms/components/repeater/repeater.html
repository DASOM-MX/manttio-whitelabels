<div class="flex flex-col gap-2">
  @for (ctrl of array().controls; track ctrl; let i = $index; let last = $last) {
    <div
      class="flex items-start gap-2 rounded-lg border border-granite-200 p-3 dark:border-granite-800"
      animate.enter="anim-enter"
    >
      <div class="min-w-0 flex-1">
        <ng-container
          *ngTemplateOutlet="rowTemplate(); context: { $implicit: ctrl, index: i }"
        ></ng-container>
      </div>

      @if (!readOnly()) {
        <div class="flex shrink-0 flex-col gap-0.5">
          <button
            type="button"
            class="inline-flex size-8 items-center justify-center rounded-md text-granite-500 transition-colors hover:bg-granite-100 hover:text-granite-800 disabled:cursor-not-allowed disabled:opacity-30 dark:text-granite-400 dark:hover:bg-granite-800 dark:hover:text-granite-200"
            (click)="move(i, -1)"
            [disabled]="i === 0"
            [attr.aria-label]="'Subir ' + itemName() + ' ' + (i + 1)"
          >
            <svg lucideChevronUp class="size-4" aria-hidden="true"></svg>
          </button>
          <button
            type="button"
            class="inline-flex size-8 items-center justify-center rounded-md text-granite-500 transition-colors hover:bg-granite-100 hover:text-granite-800 disabled:cursor-not-allowed disabled:opacity-30 dark:text-granite-400 dark:hover:bg-granite-800 dark:hover:text-granite-200"
            (click)="move(i, 1)"
            [disabled]="last"
            [attr.aria-label]="'Bajar ' + itemName() + ' ' + (i + 1)"
          >
            <svg lucideChevronDown class="size-4" aria-hidden="true"></svg>
          </button>
          <button
            type="button"
            class="inline-flex size-8 items-center justify-center rounded-md text-red-600 transition-colors hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/30"
            (click)="remove(i)"
            [attr.aria-label]="'Eliminar ' + itemName() + ' ' + (i + 1)"
          >
            <svg lucideTrash2 class="size-4" aria-hidden="true"></svg>
          </button>
        </div>
      }
    </div>
  } @empty {
    <p
      class="rounded-lg border border-dashed border-granite-300 px-4 py-6 text-center text-sm text-granite-500 dark:border-granite-700 dark:text-granite-400"
    >
      Sin elementos todavía.
    </p>
  }

  @if (!readOnly()) {
    <button
      type="button"
      class="inline-flex items-center gap-2 self-start text-sm font-semibold text-sky-700 transition-colors hover:text-sky-900 dark:text-sky-300 dark:hover:text-sky-200"
      (click)="add.emit()"
    >
      <svg lucidePlus class="size-4" aria-hidden="true"></svg>
      {{ addLabel() }}
    </button>
  }
</div>
