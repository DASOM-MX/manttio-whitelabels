<div class="w-full max-w-full">
  <canvas
    #canvas
    class="w-full h-56 border-2 border-zinc-300 dark:border-zinc-700 rounded-xl block bg-white"
  ></canvas>
  <div class="mt-4 flex flex-wrap gap-3">
    <button
      type="button"
      (click)="saveSignature()"
      class="btn-primary"
      [disabled]="capturingLocation()"
    >
      @if (capturingLocation()) {
        Obteniendo ubicación…
      } @else {
        Guardar Firma
      }
    </button>
    <button
      type="button"
      (click)="clearSignature()"
      class="btn-secondary"
      [disabled]="capturingLocation()"
    >
      Limpiar Firma
    </button>
  </div>
  <p class="mt-2 text-xs text-zinc-600 dark:text-zinc-400">
    Al guardar se solicitará la ubicación. Es obligatoria para firmar.
  </p>
</div>
