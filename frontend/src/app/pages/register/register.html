<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="min-h-screen flex items-center justify-center bg-surface p-4">
        <div class="card w-full max-w-md p-8">
            <h1 class="text-2xl font-bold text-center text-granite-900 mb-8">
                Registrar usuario
            </h1>

            <!-- Nombre -->
            <div class="mb-5">
                <label for="regName" class="field-label">Nombre</label>
                <input id="regName" type="text" formControlName="name" autocomplete="name"
                    class="field-input"
                    [class.field-input--error]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched"
                    placeholder="Nombre completo" />
                <div class="text-red-700 text-sm font-semibold mt-2 flex items-center gap-1.5"
                    *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
                    <span aria-hidden="true">⚠</span>
                    <span *ngIf="registerForm.get('name')?.hasError('required')">El nombre es obligatorio.</span>
                </div>
            </div>

            <!-- Email -->
            <div class="mb-5">
                <label for="regEmail" class="field-label">Email</label>
                <input id="regEmail" type="email" formControlName="email" autocomplete="email"
                    class="field-input"
                    [class.field-input--error]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
                    placeholder="tu@correo.com" />
                <div class="text-red-700 text-sm font-semibold mt-2 flex items-center gap-1.5"
                    *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
                    <span aria-hidden="true">⚠</span>
                    <span *ngIf="registerForm.get('email')?.hasError('required')">El email es obligatorio.</span>
                    <span *ngIf="registerForm.get('email')?.hasError('email')">Ingresa un email válido.</span>
                </div>
            </div>

            <!-- Password -->
            <div class="mb-5">
                <label for="regPassword" class="field-label">Contraseña</label>
                <input id="regPassword" type="password" formControlName="password" autocomplete="new-password"
                    class="field-input"
                    [class.field-input--error]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
                    placeholder="••••••••" />
                <div class="text-red-700 text-sm font-semibold mt-2 flex items-center gap-1.5"
                    *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
                    <span aria-hidden="true">⚠</span>
                    <span *ngIf="registerForm.get('password')?.hasError('required')">La contraseña es obligatoria.</span>
                    <span *ngIf="registerForm.get('password')?.hasError('minlength')">La contraseña debe tener al menos 8 caracteres.</span>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-5">
                <label for="regConfirm" class="field-label">Confirmar contraseña</label>
                <input id="regConfirm" type="password" formControlName="confirmPassword" autocomplete="new-password"
                    class="field-input"
                    [class.field-input--error]="(registerForm.get('confirmPassword')?.invalid || getPasswordMismatchError()) && registerForm.get('confirmPassword')?.touched"
                    placeholder="••••••••" />
                <div class="text-red-700 text-sm font-semibold mt-2 flex items-center gap-1.5"
                    *ngIf="(registerForm.get('confirmPassword')?.invalid || getPasswordMismatchError()) && registerForm.get('confirmPassword')?.touched">
                    <span aria-hidden="true">⚠</span>
                    <span *ngIf="registerForm.get('confirmPassword')?.hasError('required')">Confirma tu contraseña.</span>
                    <span *ngIf="getPasswordMismatchError()">Las contraseñas no coinciden.</span>
                </div>
            </div>

            <!-- User Role -->
            <div class="mb-8">
                <label for="role" class="field-label">Rol</label>
                <select id="role" formControlName="role" class="field-input"
                    [class.field-input--error]="registerForm.get('role')?.invalid && registerForm.get('role')?.touched">
                    <option [ngValue]="false">Técnico</option>
                    <option [ngValue]="true">Administrador</option>
                </select>
                <div class="text-red-700 text-sm font-semibold mt-2 flex items-center gap-1.5"
                    *ngIf="registerForm.get('role')?.invalid && registerForm.get('role')?.touched">
                    <span aria-hidden="true">⚠</span>
                    <span>Selecciona un rol válido.</span>
                </div>
            </div>

            <button type="submit" class="btn-primary w-full" [disabled]="registerForm.invalid">
                Registrarse
            </button>
        </div>
    </div>
</form>
