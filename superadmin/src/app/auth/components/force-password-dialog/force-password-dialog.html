<p-dialog
  [visible]="visible()"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [draggable]="false"
  [resizable]="false"
  styleClass="max-w-11/12"
  [style]="{ width: '28rem' }"
  header="Crea tu nueva contraseña"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <p class="text-sm text-surface-600 dark:text-surface-400">
      Tu cuenta tiene una contraseña temporal. Define una propia para continuar.
    </p>

    <div class="field-group">
      <label class="field-label" for="new-password"
        >Nueva contraseña<span aria-hidden="true"> *</span></label
      >
      <p-password
        inputId="new-password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="new-password"
      />
      <p class="field-hint">Mínimo 8 caracteres.</p>
    </div>

    <div class="field-group">
      <label class="field-label" for="confirm-password"
        >Confirmar contraseña<span aria-hidden="true"> *</span></label
      >
      <p-password
        inputId="confirm-password"
        formControlName="confirmPassword"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="new-password"
      />
      @if (form.hasError('passwordMismatch') && form.controls.confirmPassword.touched) {
        <p class="field-error" role="alert">
          Las contraseñas no coinciden.
        </p>
      }
    </div>

    @if (error(); as msg) {
      <p class="field-error" role="alert">{{ msg }}</p>
    }

    <button type="submit" class="btn-primary w-full" [disabled]="form.invalid || busy()">
      @if (busy()) {
        <span
          class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
          aria-hidden="true"
        ></span>
        Guardando…
      } @else {
        Guardar contraseña
      }
    </button>

    <button
      type="button"
      class="text-sm font-medium text-surface-500 transition-colors hover:text-surface-700 dark:text-surface-400 dark:hover:text-surface-200"
      (click)="logout()"
    >
      Cerrar sesión
    </button>
  </form>
</p-dialog>
