<button
  type="button"
  class="topbar-action"
  (click)="panel.toggle($event)"
  [attr.aria-label]="bellAria()"
  aria-haspopup="true"
>
  <svg lucideBell class="size-4" aria-hidden="true"></svg>
  @if (hasUnread()) {
    <span
      class="absolute -right-0.5 -top-0.5 flex h-3.5 min-w-3.5 items-center justify-center rounded-full bg-primary-600 px-1 text-2xs font-bold leading-none text-white dark:bg-primary-500"
      aria-hidden="true"
    >
      {{ badgeText() }}
    </span>
  }
</button>

<p-popover #panel appendTo="body">
  <div class="flex w-80 flex-col sm:w-96">
    <div
      class="flex h-11 items-center justify-between gap-2 border-b border-surface-200 px-4 dark:border-surface-800"
    >
      <p class="micro-label">Notificaciones</p>
      @if (hasUnread()) {
        <button type="button" class="link-action" (click)="markAllRead()">
          Marcar todas como leídas
        </button>
      }
    </div>

    @if (recent().length === 0) {
      <div class="flex flex-col items-center gap-2 px-4 py-8 text-center">
        <svg lucideBellOff class="size-6 text-surface-400" aria-hidden="true"></svg>
        <p class="text-sm text-surface-600 dark:text-surface-400">Sin notificaciones por ahora.</p>
      </div>
    } @else {
      <ul class="max-h-96 overflow-y-auto py-1">
        @for (row of recent(); track row.n.id) {
          <li>
            <button
              type="button"
              class="relative flex w-full items-start gap-3 px-4 py-2.5 text-left transition-colors hover:bg-surface-100 dark:hover:bg-surface-800"
              [class.bg-surface-100]="row.unread"
              [class.dark:bg-surface-800/40]="row.unread"
              (click)="onItemClick(row.n, panel)"
            >
              @if (row.unread) {
                <span
                  class="absolute inset-y-1 left-0 w-0.5 rounded-full bg-primary-600 dark:bg-primary-400"
                  aria-hidden="true"
                ></span>
              }
              @if (row.n.type | notificationTypeIcon; as icon) {
                <span
                  class="mt-0.5 inline-flex size-7 shrink-0 items-center justify-center rounded-full bg-surface-100 text-surface-600 dark:bg-surface-800 dark:text-surface-400"
                >
                  <svg lucideIcon [lucideIcon]="icon" class="size-4" aria-hidden="true"></svg>
                </span>
              }
              <span class="min-w-0 flex-1">
                <span
                  class="block truncate text-sm font-bold text-surface-900 dark:text-surface-100"
                >
                  {{ row.n.title }}
                </span>
                <span
                  class="mt-0.5 line-clamp-2 block text-sm leading-snug text-surface-600 dark:text-surface-400"
                >
                  {{ row.n.body }}
                </span>
                <span class="mt-1 block text-xs text-surface-500 dark:text-surface-500">
                  {{ row.n.createdAt | relativeTime }}
                </span>
              </span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</p-popover>
