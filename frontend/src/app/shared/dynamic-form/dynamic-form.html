<form [formGroup]="form" (ngSubmit)="onSubmit()" class="m-0 flex flex-col gap-7">
    @for (field of fields; track field.name) {
        <div class="field-group">
            <label class="field-label" [attr.for]="field.name">
                {{ field.label }}
            </label>

            @switch (field.type) {
                @case ('text') {
                    <input pInputText type="text" [id]="field.name" [formControlName]="field.name" />
                }
                @case ('number') {
                    <p-inputnumber [inputId]="field.name" [formControlName]="field.name"
                        mode="decimal" [useGrouping]="false" styleClass="w-full"
                        inputStyleClass="field-input">
                    </p-inputnumber>
                }
                @case ('select') {
                    <p-select [inputId]="field.name" [formControlName]="field.name"
                        [options]="field.options" styleClass="w-full"
                        placeholder="Selecciona una opción">
                    </p-select>
                }
                @case ('datetime-local') {
                    <p-datepicker [inputId]="field.name" [formControlName]="field.name"
                        [showTime]="true" hourFormat="24" dateFormat="dd/mm/yy" styleClass="w-full">
                    </p-datepicker>
                }
                @case ('image') {
                    <app-image-picker (filesSelected)="onFilesSelected($event)"></app-image-picker>
                }
                @case ('signature') {
                    <app-signature (signatureChanged)="onSignatureChanged($event)"></app-signature>
                }
                @default {
                    <div class="text-sm font-semibold text-red-700">
                        Tipo no soportado: {{ field.type }}
                    </div>
                }
            }
        </div>
    }

    <button pButton type="submit" class="btn-primary w-full !min-h-14">
        Enviar
    </button>
</form>
