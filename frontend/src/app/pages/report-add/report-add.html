<div class="min-h-screen bg-background pb-24">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 py-8 space-y-6">
        <!-- Header -->
        <div>
            <p class="text-xs font-semibold uppercase tracking-wide text-sky-700">Nuevo</p>
            <h1 class="text-2xl sm:text-3xl font-bold text-granite-900 leading-tight">
                Crear reporte
            </h1>
        </div>

        <!-- Form card -->
        <div class="card-section space-y-5">
            <div>
                <label for="reportType" class="field-label">Tipo de reporte</label>
                <p-select inputId="reportType" [(ngModel)]="selectedReportType"
                    [options]="reportTypes" appendTo="body" styleClass="w-full"
                    (ngModelChange)="onReportTypeChange($event)">
                    <ng-template let-option pTemplate="selectedItem">
                        <span class="capitalize">{{ option }}</span>
                    </ng-template>
                    <ng-template let-option pTemplate="item">
                        <span class="capitalize">{{ option }}</span>
                    </ng-template>
                </p-select>
            </div>

            <div class="transition-opacity duration-300 space-y-5"
                [class.opacity-0]="isAnimating" [class.opacity-100]="!isAnimating">
                <div>
                    <label for="customer" class="field-label">Cliente</label>
                    <p-select inputId="customer" [(ngModel)]="selectedCustomerId"
                        [options]="customers" optionLabel="name" optionValue="id"
                        appendTo="body" styleClass="w-full" [filter]="true" filterBy="name,identification"
                        placeholder="Selecciona un cliente">
                        <ng-template let-customer pTemplate="selectedItem">
                            <span>{{ customer.name }} — {{ customer.identification }}</span>
                        </ng-template>
                        <ng-template let-customer pTemplate="item">
                            <div class="flex flex-col">
                                <span class="font-semibold">{{ customer.name }}</span>
                                <span class="text-xs text-granite-600 font-data tabular-nums">
                                    {{ customer.identification }}
                                </span>
                            </div>
                        </ng-template>
                    </p-select>
                </div>

                <app-dynamic-form *ngIf="!isAnimating" [fields]="formFields"
                    (submitForm)="onFormSubmit($event)"
                    (filesSelected)="onFilesSelected($event)">
                </app-dynamic-form>
            </div>
        </div>
    </div>
</div>
