@if (!isOnline()) {
  <div
    class="flex-shrink-0 flex items-center justify-center gap-2 bg-amber-500 text-granite-950 text-sm font-semibold py-1.5 px-4"
  >
    <i class="pi pi-exclamation-triangle"></i>
    Sin conexión — los reportes se guardarán en este dispositivo
  </div>
}

<nav
  class="flex-shrink-0 bg-navy-900 border-t border-navy-700 shadow-lg text-white"
>
  <ul class="flex justify-around">
    <li class="flex-1">
      <a
        routerLink="/reports"
        routerLinkActive="text-sky-300 bg-navy-800"
        class="flex flex-col items-center gap-0.5 min-h-16 py-2.5 text-granite-100 hover:bg-navy-800 active:bg-navy-700 transition-colors"
      >
        <span class="relative">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="size-7"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z"
            />
          </svg>
          @if (pendingCount() > 0) {
            <span
              class="absolute -top-1.5 -right-2.5 inline-flex items-center justify-center h-4 min-w-4 px-1 rounded-full bg-amber-500 text-granite-950 text-xs font-bold leading-none"
              aria-label="Reportes pendientes de subir"
            >
              {{ pendingCount() }}
            </span>
          }
        </span>
        <span class="text-xs font-semibold">Reportes</span>
      </a>
    </li>
    <li class="flex-1">
      <a
        routerLink="/report-add"
        routerLinkActive="text-sky-300 bg-navy-800"
        class="flex flex-col items-center gap-0.5 min-h-16 py-2.5 text-granite-100 hover:bg-navy-800 active:bg-navy-700 transition-colors"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="size-7"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M12 4.5v15m7.5-7.5h-15"
          />
        </svg>
        <span class="text-xs font-semibold">Crear</span>
      </a>
    </li>

    <li class="relative flex-1">
      <button
        type="button"
        (click)="otrosPopover.toggle($event)"
        class="flex flex-col items-center gap-0.5 min-h-16 w-full py-2.5 text-granite-100 hover:bg-navy-800 active:bg-navy-700 focus:outline-none focus-visible:bg-navy-800 transition-colors"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="size-7"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM12.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM18.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"
          />
        </svg>
        <span class="text-xs font-semibold">Otros</span>
      </button>

      <p-popover #otrosPopover appendTo="body" styleClass="w-64 overflow-hidden">
        @if (user()?.email; as email) {
          <div class="px-4 py-3 truncate text-sm border-b text-granite-600 border-granite-200
                      dark:text-granite-400 dark:border-granite-700">
            {{ email }}
          </div>
        }
        @if (isAdmin()) {
          <a
            routerLink="/customers"
            class="block px-4 py-3 text-base font-medium transition-colors
                   hover:bg-sky-50 active:bg-sky-100
                   dark:hover:bg-granite-800 dark:active:bg-granite-700"
          >
            Clientes
          </a>
          <a
            routerLink="/register"
            class="block px-4 py-3 text-base font-medium transition-colors
                   hover:bg-sky-50 active:bg-sky-100
                   dark:hover:bg-granite-800 dark:active:bg-granite-700"
          >
            Agregar usuario
          </a>
        }
        <button
          type="button"
          (click)="toggleDarkMode()"
          [attr.aria-pressed]="darkMode()"
          class="flex w-full items-center justify-between gap-3 px-4 py-3 text-base font-medium transition-colors
                 border-t border-granite-200 hover:bg-sky-50 active:bg-sky-100
                 dark:border-granite-700 dark:hover:bg-granite-800 dark:active:bg-granite-700"
        >
          <span class="flex items-center gap-2">
            <i [class]="darkMode() ? 'pi pi-moon' : 'pi pi-sun'" aria-hidden="true"></i>
            Modo oscuro
          </span>
          <span
            class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full transition-colors
                   bg-granite-300 dark:bg-sky-600"
            aria-hidden="true"
          >
            <span
              class="inline-block size-5 rounded-full bg-white shadow transition-transform"
              [class.translate-x-5]="darkMode()"
              [class.translate-x-0.5]="!darkMode()"
            ></span>
          </span>
        </button>
        <button
          type="button"
          (click)="logout()"
          class="block w-full px-4 py-3 text-left text-base font-semibold transition-colors
                 border-t border-granite-200 text-red-700 hover:bg-red-50 active:bg-red-100
                 dark:border-granite-700 dark:text-red-300 dark:hover:bg-red-950/40 dark:active:bg-red-950/60"
        >
          Cerrar sesión
        </button>
      </p-popover>
    </li>
  </ul>
</nav>
