<p-dialog
  [visible]="dialogOpen()"
  (visibleChange)="!$event && close()"
  [modal]="true"
  [closable]="!submitting()"
  [draggable]="false"
  [resizable]="false"
  styleClass="max-w-11/12"
  [style]="{ width: '28rem' }"
  header="Eliminar reporte"
>
  <form [formGroup]="form" (ngSubmit)="confirm()" class="flex flex-col gap-4">
    <p class="text-sm text-surface-700 dark:text-surface-300">
      Vas a eliminar el reporte de
      <strong class="text-surface-1000 dark:text-surface-0">{{ target()?.customerName }}</strong>
      del {{ target()?.serviceDate }}. Queda registrado en la auditoría.
    </p>

    <div class="field-group">
      <label class="field-label" for="report-delete-comment"
        >Motivo (auditoría)<span aria-hidden="true"> *</span></label
      >
      <textarea id="report-delete-comment" pTextarea formControlName="comment" rows="2"></textarea>
    </div>

    <div class="flex justify-end gap-2">
      <button type="button" class="btn-neutral" (click)="close()" [disabled]="submitting()">
        Cancelar
      </button>
      <button type="submit" class="btn-danger" [disabled]="!canConfirm()">
        @if (submitting()) {
          <span
            class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
            aria-hidden="true"
          ></span>
          Eliminando…
        } @else {
          Eliminar reporte
        }
      </button>
    </div>
  </form>
</p-dialog>
