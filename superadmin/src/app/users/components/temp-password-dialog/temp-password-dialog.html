<p-dialog
  [visible]="dialogOpen()"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [draggable]="false"
  [resizable]="false"
  styleClass="max-w-11/12"
  [style]="{ width: '28rem' }"
  [header]="title()"
>
  <div class="flex flex-col gap-4">
    <p class="callout callout--warn flex items-start gap-2" role="alert">
      <svg lucideTriangleAlert class="mt-0.5 size-4 shrink-0" aria-hidden="true"></svg>
      Esta contraseña se muestra una sola vez. Entrégala al usuario; al iniciar sesión deberá crear
      la suya.
    </p>

    <div class="flex items-center gap-2">
      <output
        class="field-input flex flex-1 select-all items-center font-data text-lg tabular-nums"
        aria-label="Contraseña temporal"
        >{{ password() }}</output
      >
      <button
        type="button"
        class="btn-secondary shrink-0 !px-3"
        (click)="copy()"
        aria-label="Copiar contraseña"
      >
        <svg lucideCopy class="size-4" aria-hidden="true"></svg>
      </button>
    </div>

    <button type="button" class="btn-primary w-full" (click)="acknowledge()">Ya la guardé</button>
  </div>
</p-dialog>
