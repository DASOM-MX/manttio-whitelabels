<div
  class="rounded-lg border-2 border-granite-200 bg-white transition-colors focus-within:border-sky-700 focus-within:ring-4 focus-within:ring-sky-700/20 dark:border-granite-700 dark:bg-granite-900 dark:focus-within:border-sky-400 dark:focus-within:ring-sky-400/25"
>
  <div
    class="flex items-center gap-0.5 border-b border-granite-200 px-2 py-1.5 dark:border-granite-800"
    role="toolbar"
    aria-label="Formato"
  >
    <button
      type="button"
      class="inline-flex size-8 items-center justify-center rounded-md text-granite-600 transition-colors hover:bg-granite-100 hover:text-granite-900 disabled:cursor-not-allowed disabled:opacity-40 dark:text-granite-400 dark:hover:bg-granite-800 dark:hover:text-granite-100"
      (click)="exec('bold')"
      [disabled]="disabled()"
      aria-label="Negritas"
    >
      <svg lucideBold class="size-4" aria-hidden="true"></svg>
    </button>
    <button
      type="button"
      class="inline-flex size-8 items-center justify-center rounded-md text-granite-600 transition-colors hover:bg-granite-100 hover:text-granite-900 disabled:cursor-not-allowed disabled:opacity-40 dark:text-granite-400 dark:hover:bg-granite-800 dark:hover:text-granite-100"
      (click)="exec('italic')"
      [disabled]="disabled()"
      aria-label="Cursivas"
    >
      <svg lucideItalic class="size-4" aria-hidden="true"></svg>
    </button>
    <button
      type="button"
      class="inline-flex size-8 items-center justify-center rounded-md text-granite-600 transition-colors hover:bg-granite-100 hover:text-granite-900 disabled:cursor-not-allowed disabled:opacity-40 dark:text-granite-400 dark:hover:bg-granite-800 dark:hover:text-granite-100"
      (click)="exec('insertUnorderedList')"
      [disabled]="disabled()"
      aria-label="Lista con viñetas"
    >
      <svg lucideList class="size-4" aria-hidden="true"></svg>
    </button>
  </div>

  <div
    #editor
    [id]="controlId()"
    class="prose-sm min-h-28 max-w-none px-4 py-2.5 text-base text-granite-1000 focus:outline-none [&_ul]:list-disc [&_ul]:pl-5 dark:text-granite-0"
    [attr.contenteditable]="disabled() ? 'false' : 'true'"
    role="textbox"
    aria-multiline="true"
    [attr.aria-label]="ariaLabel()"
    (input)="onInput()"
    (blur)="onBlur()"
    (paste)="onPaste($event)"
  ></div>
</div>
