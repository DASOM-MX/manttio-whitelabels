name = "manttio-api"
main = "src/index.ts"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

# Brand identity (name, logos, colors, site URL, contact) is DATA, not config —
# it lives in the `brand` table and is served by GET /brand (fork rule: no
# hardcoded tenant brand in shipped code/config). The vars below are per-deploy
# INFRA only. The retired BRAND_* values were migrated into the brand row via
# the whitelabel manager's shared-token push.
[vars]
ENVIRONMENT = "dev"
CDN_BASE_URL = "https://cdn.dasom.com"
# Public base of the `manttio-logos` bucket (brand images + generated PWA
# icons). Placeholder until the bucket's public/custom domain exists — set it
# before provisioning the brand (deploy checklist, plan 02).
LOGOS_CDN_BASE_URL = "https://logos.dasom.com"
API_BASE_URL = "http://127.0.0.1:8787"
RESEND_FROM = "no-reply@dasom.com"
# FONT_CDN_BASE_URL — CDN fronting the shared `branding-fonts` bucket. Optional:
# until it exists, GET /fonts serves entries without hosted files (the two
# default families are bundled by every consumer).
# FONT_CDN_BASE_URL = "https://<branding-fonts-cdn>"

[[r2_buckets]]
binding = "MANTTIO_REPORTS"
bucket_name = "manttio-reports"

[[r2_buckets]]
binding = "MANTTIO_LOGOS"
bucket_name = "manttio-logos"

[[r2_buckets]]
binding = "MANTTIO_EQUIPMENT"
bucket_name = "manttio-equipment"

# Production deploy: `wrangler deploy --env production`.
# Wrangler v4 inherits top-level config; only the overrides live here.
[env.production.vars]
ENVIRONMENT = "production"
CDN_BASE_URL = "https://cdn.dasom.com"
LOGOS_CDN_BASE_URL = "https://logos.dasom.com"
API_BASE_URL = "https://api.dasom.com"
RESEND_FROM = "no-reply@dasom.com"

[[env.production.r2_buckets]]
binding = "MANTTIO_REPORTS"
bucket_name = "manttio-reports"

[[env.production.r2_buckets]]
binding = "MANTTIO_LOGOS"
bucket_name = "manttio-logos"

[[env.production.r2_buckets]]
binding = "MANTTIO_EQUIPMENT"
bucket_name = "manttio-equipment"

# Secrets / per-deploy env are set via `wrangler secret put [--env production]`
# (and `.dev.vars` locally) and are NOT declared here:
#   DATABASE_URL            Neon Postgres connection string
#   JWT_SECRET              HS256 signing secret for jose
#   RESEND_API_KEY          Resend API key for outbound report emails
#   MANAGER_SHARED_TOKEN    shared secret for the whitelabel manager's config
#                           pushes (X-Manager-Token on PUT /brand + /upload/image)
#   EQUIPMENT_CDN_BASE_URL  public base of the `manttio-equipment` bucket that
#                           /upload/equipment returns + persists in equipment.photos
#                           (S3 endpoint / r2.dev / custom domain — kept per-deploy,
#                           out of committed config)
