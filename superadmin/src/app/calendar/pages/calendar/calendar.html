<app-page-header
  title="Calendario"
  description="La agenda del equipo: quién va con qué cliente y cuándo."
>
  @if (canSchedule()) {
    <button type="button" class="btn-primary" (click)="openCreate()">
      <svg lucidePlus class="size-4" aria-hidden="true"></svg>
      Nueva visita
    </button>
  }
</app-page-header>

<!-- Week toolbar: navigation left, filters right. Not the filters-popover —
     a calendar's controls are its steering wheel, not an occasional refinement. -->
<div class="mb-4 flex flex-wrap items-center gap-3">
  <div class="flex items-center gap-1">
    <button type="button" class="btn-neutral !px-2" (click)="prevWeek()" aria-label="Semana anterior">
      <svg lucideChevronLeft class="size-4" aria-hidden="true"></svg>
    </button>
    <button type="button" class="btn-neutral" (click)="goToday()">Hoy</button>
    <button type="button" class="btn-neutral !px-2" (click)="nextWeek()" aria-label="Semana siguiente">
      <svg lucideChevronRight class="size-4" aria-hidden="true"></svg>
    </button>
  </div>
  <p class="text-sm font-medium text-surface-1000 dark:text-surface-0">{{ rangeLabel() }}</p>

  <div class="ml-auto flex flex-wrap items-center gap-2">
    <p-datepicker
      [formControl]="jumpControl"
      (onSelect)="onJump(jumpControl.value)"
      [showIcon]="true"
      [readonlyInput]="true"
      placeholder="Ir a fecha"
      inputStyleClass="!w-32"
    />
    <p-multiselect
      [formControl]="techFilter"
      (onChange)="onTechFilterChange()"
      [options]="techOptions()"
      optionLabel="label"
      optionValue="value"
      placeholder="Todo el equipo"
      [showToggleAll]="false"
      class="w-56"
    />
  </div>
</div>

@if (weekIsEmpty()) {
  <div class="mb-3 rounded-lg border border-dashed border-surface-300 p-4 text-center dark:border-surface-600">
    <p class="text-sm text-surface-500 dark:text-surface-400">
      Nada programado esta semana.
    </p>
  </div>
}

<!-- The grid: 7 columns on desktop, a stacked day agenda on mobile (12 §3). -->
<div class="grid grid-cols-1 gap-2 md:grid-cols-7">
  @if (loading()) {
    @for (day of skeletonDays; track day) {
      <div class="min-h-40 rounded-lg border border-surface-200 p-2 dark:border-surface-700">
        <div class="skeleton mb-2 h-4 w-16"></div>
        <div class="skeleton h-10"></div>
      </div>
    }
  } @else {
    @for (day of days(); track day.label) {
      <div
        class="flex min-h-40 flex-col gap-1.5 rounded-lg border p-2"
        [class.border-surface-200]="!day.isToday"
        [class.dark:border-surface-700]="!day.isToday"
        [class.border-primary-400]="day.isToday"
        [class.dark:border-primary-500]="day.isToday"
      >
        <p class="micro-label flex items-baseline justify-between">
          {{ day.label }}
          <span
            class="font-data text-sm"
            [class.text-primary-600]="day.isToday"
            [class.dark:text-primary-400]="day.isToday"
          >
            {{ day.dayOfMonth }}
          </span>
        </p>
        @for (visit of day.visits; track visit.id) {
          <button
            type="button"
            class="w-full rounded-md border px-2 py-1.5 text-left text-xs transition-colors"
            [class]="visit.status | visitChipClass"
            [title]="
              (visit.serviceOrderFolio || '') +
              (visit.technicianName ? ' · ' + visit.technicianName : ' · Sin asignar')
            "
            (click)="openVisit(visit)"
          >
            <span class="flex items-center gap-1.5">
              <span
                class="size-2 shrink-0 rounded-full"
                [class]="visit.technicianId | technicianDotClass"
              ></span>
              <span class="font-data font-medium">{{ visit.scheduledStart | date: 'HH:mm' }}</span>
              <span class="truncate">{{ visit.title || visit.customerName }}</span>
            </span>
          </button>
        }
      </div>
    }
  }
</div>

<app-visit-dialog
  #visitDialog
  (changed)="reloadWeek()"
  (closeRequested)="onCloseRequested($event)"
/>
<app-close-visit-dialog
  #closeDialog
  (changed)="reloadWeek()"
  (rescheduleRequested)="onRescheduleRequested($event)"
/>
<app-reschedule-visit-dialog #rescheduleDialog (rescheduled)="reloadWeek()" />
