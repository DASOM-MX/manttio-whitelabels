@if (isBooting()) {
  <!-- Splash: no gated UI renders until /portal/auth/me resolves. -->
  <div
    class="flex h-dvh flex-col items-center justify-center gap-4 bg-background dark:bg-zinc-950"
  >
    @if (logoUrl(); as logo) {
      <img [src]="logo" [alt]="logoAlt()" class="h-16 w-auto object-contain" />
    } @else {
      <p class="font-extrabold text-2xl tracking-tight text-zinc-950 dark:text-zinc-50">
        Portal de clientes
      </p>
    }
    <div
      class="size-8 animate-spin rounded-full border-2 border-zinc-200 border-t-primary-600 dark:border-zinc-700 dark:border-t-primary-400"
      role="status"
      aria-label="Cargando"
    ></div>
  </div>
} @else if (hasError()) {
  <div class="flex h-dvh items-center justify-center bg-background p-6 dark:bg-zinc-950">
    <div class="card-section w-full max-w-sm text-center">
      <h1 class="text-lg font-bold text-zinc-950 dark:text-zinc-50">
        No se pudo cargar tu sesión
      </h1>
      <p class="mt-2 text-sm text-zinc-600 dark:text-zinc-400">
        Revisa tu conexión e inténtalo de nuevo.
      </p>
      <div class="mt-4 flex flex-col gap-2">
        <button type="button" class="btn-primary" (click)="retryMe()">
          <svg lucideRefreshCw class="size-4" aria-hidden="true"></svg>
          Reintentar
        </button>
        <button type="button" class="btn-neutral" (click)="logout()">Cerrar sesión</button>
      </div>
    </div>
  </div>
} @else {
  <div class="flex h-dvh bg-background dark:bg-zinc-950">
    <!-- Desktop sidebar: collapsible into an icon rail. -->
    <aside
      class="shell-sidebar relative z-20 hidden shrink-0 flex-col lg:flex"
      [class.w-64]="!sidebarCollapsed()"
      [class.w-20]="sidebarCollapsed()"
      aria-label="Navegación principal"
    >
      <app-sidebar [collapsed]="sidebarCollapsed()" />
    </aside>

    <!-- Mobile drawer -->
    @if (drawerOpen()) {
      <div
        class="fixed inset-0 z-40 bg-zinc-950/50 lg:hidden"
        animate.enter="anim-fade-enter"
        animate.leave="anim-leave"
        (click)="drawerOpen.set(false)"
        aria-hidden="true"
      ></div>
      <aside
        class="fixed inset-y-0 left-0 z-50 flex w-72 max-w-11/12 flex-col border-r border-zinc-200 bg-zinc-50 shadow-xl lg:hidden dark:border-zinc-800 dark:bg-zinc-900"
        animate.enter="anim-drawer-enter"
        animate.leave="anim-drawer-leave"
        aria-label="Navegación principal"
      >
        <app-sidebar (closed)="drawerOpen.set(false)" />
      </aside>
    }

    <div class="flex min-w-0 flex-1 flex-col">
      <!-- Topbar: dark-mode toggle + account trigger, no in-app
           notifications (00 §3.15) and no search stub. -->
      <header
        class="relative z-10 flex h-14 shrink-0 items-center gap-3 border-b border-zinc-200 bg-zinc-50 px-4 sm:px-6 dark:border-zinc-800 dark:bg-zinc-900"
      >
        <button
          type="button"
          class="topbar-action lg:hidden"
          (click)="drawerOpen.set(true)"
          aria-label="Abrir menú"
        >
          <svg lucideMenu class="size-4" aria-hidden="true"></svg>
        </button>

        <div class="flex-1"></div>

        <div class="flex items-center gap-2">
          <button
            type="button"
            class="topbar-action"
            (click)="toggleDark()"
            [attr.aria-label]="themeLabel()"
            [title]="themeLabel()"
          >
            @if (darkMode()) {
              <svg lucideSun class="size-4" aria-hidden="true"></svg>
            } @else {
              <svg lucideMoon class="size-4" aria-hidden="true"></svg>
            }
          </button>

          <button
            type="button"
            class="topbar-avatar"
            (click)="userMenu.toggle($event)"
            aria-haspopup="true"
            [attr.aria-label]="accountLabel()"
            [title]="accountLabel()"
          >
            <svg lucideUserRound class="size-4" aria-hidden="true"></svg>
          </button>
        </div>
        <p-popover #userMenu appendTo="body">
          <div class="w-64 py-1.5">
            <div class="border-b border-zinc-200 px-4 py-3 dark:border-zinc-800">
              <p class="truncate text-sm font-bold text-zinc-950 dark:text-zinc-50">
                {{ user()?.user?.name }}
              </p>
              <p class="mt-0.5 truncate text-sm text-zinc-600 dark:text-zinc-400">
                {{ user()?.user?.email }}
              </p>
              <p class="micro-label mt-2">{{ user()?.customer?.name }}</p>
            </div>
            <button
              type="button"
              class="flex w-full items-center gap-2.5 px-4 py-2.5 text-left text-sm font-bold text-red-700 transition-colors hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/30"
              (click)="logout()"
            >
              <svg lucideLogOut class="size-4" aria-hidden="true"></svg>
              Cerrar sesión
            </button>
          </div>
        </p-popover>
      </header>

      <!-- Single scroll region -->
      <main #scrollContainer id="main-content" class="flex-1 overflow-y-auto" tabindex="-1">
        <div #pageContainer class="anim-page-enter w-full px-4 py-2.5 sm:px-6 md:px-8">
          <router-outlet />
        </div>
      </main>
    </div>
  </div>
}
