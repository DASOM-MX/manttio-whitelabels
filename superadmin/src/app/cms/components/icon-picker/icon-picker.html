<button
  type="button"
  class="inline-flex size-12 shrink-0 items-center justify-center rounded-lg border-2 bg-white text-granite-700 transition-colors focus:border-sky-700 focus:outline-none focus:ring-4 focus:ring-sky-700/20 disabled:bg-granite-50 disabled:text-granite-400 dark:bg-granite-900 dark:text-granite-300 dark:focus:border-sky-400 dark:focus:ring-sky-400/25 dark:disabled:bg-granite-800"
  [class.border-granite-200]="!value()"
  [class.border-dashed]="!value()"
  [class.border-granite-300]="value()"
  [class.dark:border-granite-700]="!value()"
  [class.dark:border-granite-600]="value()"
  (click)="grid.toggle($event)"
  [disabled]="disabled()"
  aria-label="Elegir icono"
  title="Elegir icono"
>
  @if (value()) {
    <app-service-icon [icon]="value()" svgClass="size-5" />
  } @else {
    <svg lucidePlus class="size-4 text-granite-400" aria-hidden="true"></svg>
  }
</button>

<p-popover #grid appendTo="body">
  <div class="grid grid-cols-4 gap-1" role="listbox" aria-label="Iconos disponibles">
    @for (option of icons; track option.code) {
      <button
        type="button"
        role="option"
        class="inline-flex size-10 items-center justify-center rounded-md transition-colors"
        [class.bg-sky-100]="value() === option.code"
        [class.text-sky-800]="value() === option.code"
        [class.dark:bg-sky-950]="value() === option.code"
        [class.dark:text-sky-300]="value() === option.code"
        [class.text-granite-600]="value() !== option.code"
        [class.hover:bg-granite-100]="value() !== option.code"
        [class.dark:text-granite-300]="value() !== option.code"
        [class.dark:hover:bg-granite-800]="value() !== option.code"
        [attr.aria-selected]="value() === option.code"
        [attr.aria-label]="option.label"
        [attr.title]="option.label"
        (click)="pick(option.code, grid)"
      >
        <app-service-icon [icon]="option.code" svgClass="size-5" />
      </button>
    }
  </div>
  @if (value()) {
    <button
      type="button"
      class="mt-2 w-full rounded-md px-2 py-1.5 text-center text-sm font-medium text-red-600 transition-colors hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/30"
      (click)="clear(grid)"
    >
      Quitar icono
    </button>
  }
</p-popover>
