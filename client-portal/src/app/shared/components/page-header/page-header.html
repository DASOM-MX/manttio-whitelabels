<header class="mb-6 flex flex-wrap items-center gap-x-4 gap-y-3">
  @if (backLink(); as link) {
    <a
      [routerLink]="link"
      class="inline-flex size-10 shrink-0 items-center justify-center rounded-full text-zinc-600 transition-colors hover:bg-zinc-100 dark:text-zinc-400 dark:hover:bg-zinc-800"
      [attr.aria-label]="backLabel()"
    >
      <svg lucideArrowLeft class="size-5" aria-hidden="true"></svg>
    </a>
  }
  <div class="min-w-0">
    <div class="flex flex-wrap items-center gap-2.5">
      <h1 class="text-2xl font-bold tracking-tight text-zinc-950 dark:text-zinc-50">
        {{ title() }}
      </h1>
      <ng-content select="[meta]" />
    </div>
    @if (description(); as text) {
      <p class="mt-1 text-sm text-zinc-600 dark:text-zinc-400">{{ text }}</p>
    }
  </div>
  <div class="ml-auto flex flex-wrap items-center gap-2 empty:hidden">
    <ng-content />
  </div>
</header>
