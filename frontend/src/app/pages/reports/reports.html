<div class="min-h-screen flex items-center justify-center bg-surface p-4">
    <div class="w-full max-w-2xl flex flex-col items-center space-y-6">
        <h2 class="text-3xl font-bold text-dark text-center mb-6 text-justify">
            Reporte de Servicios para Equipos de Agua Helada Chiller
        </h2>

        <div *ngFor="let reporte of reports"
            class="w-full border border-secondary bg-background rounded-xl shadow-md p-6 space-y-3">
            <a [routerLink]="['/reports', reporte.folio]"
                class="block border p-4 mb-4 rounded shadow bg-background hover:shadow-lg transition">
                <h3 class="text-xl font-semibold text-primary">Folio: {{ reporte.folio }}</h3>
            </a>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2">
                <p><span class="font-semibold text-dark">Fecha:</span> {{ reporte.fecha }}</p>
                <p><span class="font-semibold text-dark">Cliente:</span> {{ reporte.cliente }}</p>
                <p><span class="font-semibold text-dark">Responsable:</span> {{ reporte.responsable }}</p>
                <p><span class="font-semibold text-dark">Tipo de mantenimiento:</span> {{ reporte.tipoMantenimiento
                    }}
                </p>
            </div>
        </div>
    </div>
</div>
