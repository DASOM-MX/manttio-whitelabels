<p-dialog
  [visible]="dialogOpen()"
  (visibleChange)="!$event && close()"
  [modal]="true"
  [closable]="!submitting()"
  [draggable]="false"
  [resizable]="false"
  styleClass="dialog-md"
  header="Cerrar visita"
>
  <div class="grid gap-4">
    <p class="text-sm text-surface-700 dark:text-surface-300">
      La visita no se atendió. Cerrarla es definitivo — el reemplazo, si lo hay, es una visita
      nueva ligada a esta.
    </p>

    <form [formGroup]="form" (ngSubmit)="confirm()" class="grid gap-4">
      <div class="field-group">
        <label class="field-label" for="visit-close-reason">
          Motivo<span aria-hidden="true"> *</span>
        </label>
        <p-select
          inputId="visit-close-reason"
          formControlName="reason"
          [options]="reasonOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="¿Qué pasó?"
        />
      </div>

      <div class="field-group">
        <label class="field-label" for="visit-close-note">
          Detalle@if (noteRequired()) {<span aria-hidden="true"> *</span>}
        </label>
        <textarea
          id="visit-close-note"
          pTextarea
          formControlName="note"
          rows="2"
          class="!min-h-16"
          placeholder="Contexto para la bitácora de la orden…"
        ></textarea>
        @if (noteRequired()) {
          <p class="field-hint">"Otro motivo" necesita explicarse solo — este texto va al cliente.</p>
        }
      </div>

      <div class="flex justify-end gap-2">
        <button type="button" class="btn-neutral" (click)="close()" [disabled]="submitting()">
          Volver
        </button>
        <button type="submit" class="btn-danger" [disabled]="!canConfirm()">
          @if (submitting()) {
            Cerrando…
          } @else {
            Cerrar visita
          }
        </button>
      </div>
    </form>
  </div>
</p-dialog>
