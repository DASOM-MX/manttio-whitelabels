<div class="min-h-screen flex items-center justify-center bg-surface p-4">
    <div class="card w-full max-w-md p-8">
        <img src="assets/logo.jpg" alt="Logo" class="w-32 h-auto mb-8 mx-auto" />

        <!-- Login Form -->
        <div *ngIf="!showRegister">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <h1 class="text-2xl font-bold text-center text-granite-900 mb-8">
                    Iniciar sesión
                </h1>

                <div class="mb-5">
                    <label for="loginEmail" class="field-label">Email</label>
                    <input id="loginEmail" type="email" formControlName="email" autocomplete="email"
                        class="field-input"
                        [class.field-input--error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
                        placeholder="tu@correo.com" />
                    <div class="text-red-700 text-sm font-semibold mt-2 flex items-center gap-1.5"
                        *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                        <span aria-hidden="true">⚠</span>
                        <span *ngIf="loginForm.get('email')?.hasError('required')">El email es obligatorio.</span>
                        <span *ngIf="loginForm.get('email')?.hasError('email')">Ingresa un email válido.</span>
                    </div>
                </div>

                <div class="mb-8">
                    <label for="loginPassword" class="field-label">Contraseña</label>
                    <input id="loginPassword" type="password" formControlName="password" autocomplete="current-password"
                        class="field-input"
                        [class.field-input--error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                        placeholder="••••••••" />
                    <div class="text-red-700 text-sm font-semibold mt-2 flex items-center gap-1.5"
                        *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                        <span aria-hidden="true">⚠</span>
                        <span *ngIf="loginForm.get('password')?.hasError('required')">La contraseña es obligatoria.</span>
                        <span *ngIf="loginForm.get('password')?.hasError('minlength')">La contraseña debe tener al menos 8 caracteres.</span>
                    </div>
                </div>

                <button type="submit" class="btn-primary w-full" [disabled]="loginForm.invalid">
                    Entrar
                </button>
            </form>
        </div>

        <!-- Register Form -->
        <div *ngIf="showRegister">
            <app-register></app-register>
        </div>
    </div>
</div>
